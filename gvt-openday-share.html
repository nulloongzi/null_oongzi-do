<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>GVT 오픈짐 배치표</title>
  <meta name="description" content="GVT 오픈짐 라운드별 팀 배치표">
  <meta name="robots" content="noindex">
  <style>
    :root {
      --white: #fff;
      --nurungji-yellow: #fac710;
      --nurungji-brown: #8d6e63;
      --nurungji-dark: #4e342e;
      --nurungji-bg: #fff8e1;
      --nurungji-light: #fffde7;
      --urgent-color: #ff7043;
      --shadow: 0 8px 32px rgba(93, 64, 55, .15);
      --shadow-sm: 0 4px 12px rgba(93, 64, 55, .12);
      --line: rgba(141, 110, 99, .22);

      --pos-s: #fac710;
      --pos-s-fg: #4e342e;
      --pos-op: #ff7043;
      --pos-oh: #8d6e63;
      --pos-mb: #4e342e;
      --pos-li: #00897b;
    }

    * {
      box-sizing: border-box;
      font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, system-ui, Roboto,
        "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", "Apple Color Emoji", sans-serif;
    }

    body {
      margin: 0;
      background: var(--nurungji-bg);
      color: var(--nurungji-dark);
      -webkit-text-size-adjust: 100%;
    }

    .wrap {
      max-width: 940px;
      margin: 0 auto;
      padding: 20px 14px 64px;
    }

    /* ---------- header ---------- */
    header.hero {
      background: linear-gradient(135deg, #fffdf3, var(--nurungji-light));
      border: 1px solid var(--line);
      border-radius: 22px;
      box-shadow: var(--shadow);
      padding: 20px 20px 18px;
    }

    .kicker {
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .12em;
      color: var(--nurungji-brown);
    }

    h1 {
      margin: 6px 0 4px;
      font-size: 26px;
      letter-spacing: -.02em;
    }

    .sub {
      font-size: 14px;
      color: var(--nurungji-brown);
      font-weight: 600;
    }

    .rules {
      margin-top: 14px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .rule {
      background: var(--white);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 5px 11px;
      font-size: 12.5px;
      font-weight: 600;
    }

    .hint {
      margin-top: 12px;
      font-size: 12.5px;
      font-weight: 700;
      color: var(--nurungji-brown);
      background: var(--white);
      border: 1px dashed var(--line);
      border-radius: 12px;
      padding: 9px 12px;
    }

    /* ---------- tabs ---------- */
    .tabs {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      gap: 5px;
      margin: 18px 0 16px;
      padding: 8px;
      background: rgba(255, 248, 225, .92);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid var(--line);
      border-radius: 16px;
      box-shadow: var(--shadow-sm);
      overflow-x: auto;
    }

    .tab {
      flex: 1 0 auto;
      min-width: 76px;
      border: 0;
      cursor: pointer;
      border-radius: 11px;
      padding: 9px 10px;
      background: transparent;
      color: var(--nurungji-brown);
      font-size: 14px;
      font-weight: 800;
      line-height: 1.35;
      transition: .15s;
    }

    .tab small {
      display: block;
      font-size: 11px;
      font-weight: 600;
      opacity: .75;
    }

    .tab[aria-selected="true"] {
      background: var(--nurungji-yellow);
      color: var(--nurungji-dark);
      box-shadow: var(--shadow-sm);
    }

    .tab.alt[aria-selected="true"] {
      background: var(--nurungji-dark);
      color: var(--white);
    }

    /* ---------- round ---------- */
    .round-head {
      display: flex;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 10px;
      margin: 4px 2px 14px;
    }

    .round-head h2 {
      margin: 0;
      font-size: 20px;
    }

    .round-head .meta {
      font-size: 13px;
      font-weight: 600;
      color: var(--nurungji-brown);
    }

    /* ---------- game card ---------- */
    .game {
      background: var(--white);
      border: 1px solid var(--line);
      border-radius: 20px;
      box-shadow: var(--shadow-sm);
      padding: 16px 14px 14px;
      margin-bottom: 16px;
    }

    .game-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 15px;
      font-weight: 800;
      margin-bottom: 12px;
    }

    .badge-no {
      background: var(--nurungji-dark);
      color: var(--nurungji-yellow);
      border-radius: 8px;
      font-size: 12px;
      padding: 3px 8px;
    }

    .court {
      display: grid;
      gap: 0;
      max-width: 460px;
      margin: 0 auto;
    }

    .side {
      border: 2px solid var(--nurungji-brown);
      background: repeating-linear-gradient(45deg, #fffdf5, #fffdf5 10px, #fffbea 10px, #fffbea 20px);
      padding: 8px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }

    .side.top {
      border-radius: 14px 14px 0 0;
      border-bottom: 0;
    }

    .side.bottom {
      border-radius: 0 0 14px 14px;
      border-top: 0;
    }

    .net {
      height: 16px;
      background: repeating-linear-gradient(90deg, var(--nurungji-dark) 0 2px, transparent 2px 6px);
      border-top: 3px solid var(--nurungji-dark);
      border-bottom: 3px solid var(--nurungji-dark);
    }

    .team-label {
      grid-column: 1/-1;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      font-weight: 800;
      color: var(--nurungji-brown);
      padding: 0 2px;
    }

    .team-label .tname {
      background: var(--nurungji-dark);
      color: var(--white);
      border-radius: 7px;
      padding: 2px 8px;
      font-size: 11.5px;
      letter-spacing: .04em;
    }

    .cell {
      background: var(--white);
      border: 1px solid var(--line);
      border-radius: 11px;
      padding: 7px 5px 6px;
      text-align: center;
      min-height: 62px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 3px;
      cursor: pointer;
      transition: .12s;
    }

    .cell .zone {
      font-size: 10px;
      font-weight: 800;
      color: var(--nurungji-brown);
      opacity: .8;
    }

    .cell .name {
      font-size: 13.5px;
      font-weight: 800;
      letter-spacing: -.02em;
      word-break: keep-all;
    }

    .pos {
      display: inline-block;
      font-size: 10.5px;
      font-weight: 800;
      border-radius: 999px;
      padding: 1px 7px;
      color: #fff;
      letter-spacing: .02em;
    }

    .pos.S {
      background: var(--pos-s);
      color: var(--pos-s-fg);
    }

    .pos.OP {
      background: var(--pos-op);
    }

    .pos.OH {
      background: var(--pos-oh);
    }

    .pos.MB {
      background: var(--pos-mb);
    }

    .pos.Li {
      background: var(--pos-li);
    }

    .cell.hl {
      outline: 3px solid var(--nurungji-yellow);
      outline-offset: 1px;
      background: #fffbe6;
      transform: translateY(-1px);
    }

    .bench {
      margin-top: 12px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
      font-size: 12.5px;
      color: var(--nurungji-brown);
      font-weight: 700;
    }

    .chip {
      background: var(--nurungji-bg);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 4px 10px;
      font-size: 12.5px;
      font-weight: 700;
      color: var(--nurungji-dark);
      cursor: pointer;
    }

    .chip.hl {
      background: var(--nurungji-yellow);
    }

    /* ---------- cards / tables ---------- */
    .card {
      background: var(--white);
      border: 1px solid var(--line);
      border-radius: 20px;
      box-shadow: var(--shadow-sm);
      padding: 16px 16px 14px;
      margin-bottom: 14px;
    }

    .card h3 {
      margin: 0 0 10px;
      font-size: 15px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .card h3 .ic {
      width: 26px;
      height: 26px;
      flex: 0 0 26px;
      border-radius: 9px;
      background: var(--nurungji-yellow);
      display: grid;
      place-items: center;
      font-size: 14px;
    }

    .card.warn {
      border-color: rgba(255, 112, 67, .4);
      background: #fff7f3;
    }

    .card.warn h3 .ic {
      background: var(--urgent-color);
    }

    .card p,
    .card li {
      font-size: 13.5px;
      line-height: 1.75;
      margin: 0;
    }

    .card ul {
      margin: 0;
      padding-left: 19px;
    }

    .card ul li+li {
      margin-top: 4px;
    }

    .card b {
      color: #b5410e;
    }

    .tl {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 0 12px;
    }

    .tl dt {
      font-size: 13px;
      font-weight: 800;
      color: var(--nurungji-dark);
      padding: 7px 0;
      border-top: 1px solid var(--line);
      white-space: nowrap;
    }

    .tl dd {
      font-size: 13.5px;
      margin: 0;
      padding: 7px 0;
      border-top: 1px solid var(--line);
      color: var(--nurungji-brown);
      font-weight: 600;
    }

    .tl dt:first-of-type,
    .tl dt:first-of-type+dd {
      border-top: 0;
    }

    .tl dd b {
      color: var(--nurungji-dark);
    }

    .tscroll {
      overflow-x: auto;
      padding-bottom: 8px;
    }

    table {
      border-collapse: collapse;
      width: 100%;
      min-width: 400px;
      font-size: 12.5px;
    }

    th,
    td {
      border-bottom: 1px solid var(--line);
      padding: 8px;
      text-align: left;
      white-space: nowrap;
    }

    th {
      color: var(--nurungji-brown);
      font-size: 11.5px;
      letter-spacing: .04em;
    }

    td.nm {
      font-weight: 800;
    }

    td.rest {
      color: var(--nurungji-brown);
      opacity: .7;
      white-space: normal;
      word-break: keep-all;
    }

    tr.hl td {
      background: #fffbe6;
    }

    details.sheet {
      background: var(--white);
      border: 1px solid var(--line);
      border-radius: 18px;
      box-shadow: var(--shadow-sm);
      padding: 4px 14px;
      margin-bottom: 14px;
    }

    details.sheet>summary {
      cursor: pointer;
      list-style: none;
      padding: 12px 0;
      font-size: 14px;
      font-weight: 800;
    }

    details.sheet>summary::-webkit-details-marker {
      display: none;
    }

    details.sheet>summary::after {
      content: "▾";
      float: right;
      color: var(--nurungji-brown);
    }

    details.sheet[open]>summary::after {
      content: "▴";
    }

    footer {
      margin-top: 22px;
      text-align: center;
      font-size: 12px;
      color: var(--nurungji-brown);
      line-height: 1.8;
    }

    @media (max-width:420px) {
      .cell {
        min-height: 58px;
        padding: 6px 3px;
      }

      .cell .name {
        font-size: 12.5px;
      }

      h1 {
        font-size: 22px;
      }
    }
  </style>
</head>

<body>
  <div class="wrap">
    <header class="hero">
      <div class="kicker">GVT OPEN GYM</div>
      <h1>오픈짐 라운드 배치표</h1>
      <div class="sub">토요일 · 광남초 별관 3층 · 13:00–17:00</div>
      <div class="rules">
        <span class="rule">6:6 정규 게임</span>
        <span class="rule">세트당 18점 · 단판</span>
        <span class="rule">한 라운드 = 3게임</span>
        <span class="rule">라운드 후 10분 휴식</span>
      </div>
      <div class="hint">👆 코트에서 <b>본인 이름을 누르면</b> 모든 라운드의 내 자리가 노란색으로 표시됩니다.</div>
    </header>

    <div class="tabs" id="tabs" role="tablist"></div>
    <div id="panels"></div>

    <footer>GVT 오픈짐 배치표</footer>
  </div>

  <script>
    /* ============================================================
       인원
       ============================================================ */
    var CAP = {
      '유성원': ['S', 'OP', 'OH', 'MB', 'Li'],
      '강홍준': ['S', 'OP', 'OH', 'MB', 'Li'],
      '이재영': ['OH', 'OP'],
      '김민상': ['OH', 'MB'],
      '남석현': ['OP', 'OH', 'MB', 'Li'],
      '송승목': ['S', 'OP', 'OH', 'Li'],
      'Tim': ['S'],
      '우건세': ['OP', 'OH', 'MB'],
      '정승호': ['S', 'OP', 'OH', 'Li'],
      '김연재': ['S', 'OP'],
      '김형준': ['OP'],
      '허민혁': ['S'],
      '김준우': ['OP', 'MB'],
      'Kat': ['Li']
    };
    var NOTE = {
      '우건세': '15:30 이탈',
      'Kat': '16:00 이탈'
    };
    var ALL14 = Object.keys(CAP);
    var R3 = ALL14.filter(function (n) { return n !== '우건세'; });
    var R4 = R3.filter(function (n) { return n !== 'Kat'; });

    function t() {
      var a = [], i;
      for (i = 0; i < arguments.length; i += 2) a.push({ n: arguments[i], p: arguments[i + 1] });
      return a;
    }

    /* ---------- 1R ---------- */
    var A1 = t('Tim', 'S', '김형준', 'OP', '이재영', 'OH', '송승목', 'OH', '유성원', 'MB', 'Kat', 'Li');
    var B1 = t('허민혁', 'S', '우건세', 'OP', '정승호', 'OH', '강홍준', 'OH', '김준우', 'MB', '남석현', 'MB');
    var C1g2 = t('김연재', 'S', '김형준', 'OP', '이재영', 'OH', '송승목', 'OH', '김민상', 'MB', 'Kat', 'Li');
    var C1g3 = t('김연재', 'S', '우건세', 'OP', '정승호', 'OH', '강홍준', 'OH', '김민상', 'MB', '김준우', 'MB');

    /* ---------- 2R ---------- */
    var A2 = t('허민혁', 'S', '이재영', 'OP', '김민상', 'OH', '남석현', 'OH', '김준우', 'MB', '유성원', 'MB');
    var B2 = t('김연재', 'S', '김형준', 'OP', '송승목', 'OH', '정승호', 'OH', '우건세', 'MB', 'Kat', 'Li');
    var C2g2 = t('Tim', 'S', '김준우', 'OP', '이재영', 'OH', '강홍준', 'OH', '김민상', 'MB', '남석현', 'MB');
    var C2g3 = t('Tim', 'S', '김형준', 'OP', '송승목', 'OH', '정승호', 'OH', '강홍준', 'MB', 'Kat', 'Li');

    /* ---------- 3R ---------- */
    var A3 = t('Tim', 'S', '김연재', 'OP', '이재영', 'OH', '송승목', 'OH', '김준우', 'MB', '유성원', 'MB');
    var B3g1 = t('허민혁', 'S', '김형준', 'OP', '정승호', 'OH', '강홍준', 'OH', '김민상', 'MB', 'Kat', 'Li');
    var B3g2 = t('허민혁', 'S', '김형준', 'OP', '정승호', 'OH', '김민상', 'OH', '강홍준', 'MB', 'Kat', 'Li');
    var C3g2 = t('Tim', 'S', '김연재', 'OP', '이재영', 'OH', '유성원', 'OH', '남석현', 'MB', '송승목', 'Li');
    var C3g3 = t('허민혁', 'S', '김형준', 'OP', '정승호', 'OH', '김민상', 'OH', '강홍준', 'MB', '남석현', 'MB');

    /* ---------- 4R ---------- */
    var A4g1 = t('Tim', 'S', '김형준', 'OP', '이재영', 'OH', '강홍준', 'OH', '김민상', 'MB', '정승호', 'Li');
    var B4g1 = t('허민혁', 'S', '김연재', 'OP', '유성원', 'OH', '남석현', 'OH', '김준우', 'MB', '송승목', 'Li');
    var B4g2 = t('허민혁', 'S', '김형준', 'OP', '송승목', 'OH', '이재영', 'OH', '김준우', 'MB', '유성원', 'MB');
    var C4g2 = t('Tim', 'S', '김연재', 'OP', '정승호', 'OH', '김민상', 'OH', '남석현', 'MB', '강홍준', 'MB');
    var C4g3 = t('허민혁', 'S', '김연재', 'OP', '정승호', 'OH', '강홍준', 'OH', '남석현', 'MB', '송승목', 'Li');
    var A4g3 = t('Tim', 'S', '김형준', 'OP', '이재영', 'OH', '김민상', 'OH', '김준우', 'MB', '유성원', 'MB');

    var ROUNDS = [
      {
        id: '1R', time: '14:00', roster: ALL14,
        games: [
          { label: 'A vs B', home: { t: 'A', l: A1 }, away: { t: 'B', l: B1 }, bench: ['김연재', '김민상'] },
          { label: 'B vs C', home: { t: 'B', l: B1 }, away: { t: 'C', l: C1g2 }, bench: ['Tim', '유성원'] },
          { label: 'C vs A', home: { t: 'C', l: C1g3 }, away: { t: 'A', l: A1 }, bench: ['허민혁', '남석현'] }
        ]
      },
      {
        id: '2R', time: '14:50', roster: ALL14,
        games: [
          { label: 'A vs B', home: { t: 'A', l: A2 }, away: { t: 'B', l: B2 }, bench: ['Tim', '강홍준'] },
          { label: 'B vs C', home: { t: 'B', l: B2 }, away: { t: 'C', l: C2g2 }, bench: ['허민혁', '유성원'] },
          { label: 'C vs A', home: { t: 'C', l: C2g3 }, away: { t: 'A', l: A2 }, bench: ['김연재', '우건세'] }
        ]
      },
      {
        id: '3R', time: '15:40', roster: R3,
        games: [
          { label: 'A vs B', home: { t: 'A', l: A3 }, away: { t: 'B', l: B3g1 }, bench: ['남석현'] },
          { label: 'B vs C', home: { t: 'B', l: B3g2 }, away: { t: 'C', l: C3g2 }, bench: ['김준우'] },
          { label: 'C vs A', home: { t: 'C', l: C3g3 }, away: { t: 'A', l: A3 }, bench: ['Kat'] }
        ]
      },
      {
        id: '4R', time: '16:30', roster: R4,
        games: [
          { label: 'A vs B', home: { t: 'A', l: A4g1 }, away: { t: 'B', l: B4g1 }, bench: [] },
          { label: 'B vs C', home: { t: 'B', l: B4g2 }, away: { t: 'C', l: C4g2 }, bench: [] },
          { label: 'C vs A', home: { t: 'C', l: C4g3 }, away: { t: 'A', l: A4g3 }, bench: [] }
        ]
      }
    ];

    /* ============================================================
       코트 — 세터가 존1(우후위)에서 서브 시작
       ============================================================ */
    function toZones(lineup) {
      var z = {}, ohs = [2, 5], mbs = [3, 6], i, p;
      for (i = 0; i < lineup.length; i++) {
        p = lineup[i];
        if (p.p === 'S') z[1] = p;
        else if (p.p === 'OP') z[4] = p;
        else if (p.p === 'OH') z[ohs.shift()] = p;
        else if (p.p === 'MB') z[mbs.shift()] = p;
        else if (p.p === 'Li') z[6] = p;
      }
      return z;
    }

    var TOP_ROWS = [[1, 6, 5], [2, 3, 4]];
    var BOT_ROWS = [[4, 3, 2], [5, 6, 1]];

    function cellHTML(pl, zone) {
      return '<div class="cell" data-p="' + pl.n + '">' +
        '<span class="zone">존 ' + zone + '</span>' +
        '<span class="name">' + pl.n + '</span>' +
        '<span><span class="pos ' + pl.p + '">' + pl.p + '</span></span></div>';
    }

    function sideHTML(team, lineup, isTop) {
      var z = toZones(lineup), rows = isTop ? TOP_ROWS : BOT_ROWS, html = '', r, i;
      var label = '<div class="team-label"><span class="tname">TEAM ' + team + '</span>' +
        '<span>' + lineup.length + '명</span></div>';
      for (r = 0; r < rows.length; r++)
        for (i = 0; i < rows[r].length; i++) html += cellHTML(z[rows[r][i]], rows[r][i]);
      return '<div class="side ' + (isTop ? 'top' : 'bottom') + '">' +
        (isTop ? label + html : html + label) + '</div>';
    }

    function gameHTML(g, idx) {
      var bench = g.bench.length
        ? g.bench.map(function (n) { return '<span class="chip" data-p="' + n + '">' + n + '</span>'; }).join('')
        : '<span class="chip" style="opacity:.6">없음 · 전원 출전</span>';
      return '<div class="game">' +
        '<div class="game-title"><span class="badge-no">' + (idx + 1) + '경기</span>' + g.label + '</div>' +
        '<div class="court">' +
        sideHTML(g.home.t, g.home.l, true) +
        '<div class="net"></div>' +
        sideHTML(g.away.t, g.away.l, false) +
        '</div>' +
        '<div class="bench"><span>대기</span>' + bench + '</div>' +
        '</div>';
    }

    function sheetHTML(roster, games) {
      var head = '<tr><th>이름</th>' + games.map(function (g, i) {
        return '<th>' + (i + 1) + '경기 · ' + g.label + '</th>';
      }).join('') + '</tr>';
      var body = roster.map(function (n) {
        var tds = games.map(function (g) {
          var found = null, side = null, s, i;
          for (s = 0; s < 2; s++) {
            var team = s === 0 ? g.home : g.away;
            for (i = 0; i < team.l.length; i++)
              if (team.l[i].n === n) { found = team.l[i]; side = team.t; }
          }
          return found
            ? '<td><b>' + side + '</b> · <span class="pos ' + found.p + '">' + found.p + '</span></td>'
            : '<td class="rest">대기</td>';
        }).join('');
        return '<tr data-p="' + n + '"><td class="nm">' + n + '</td>' + tds + '</tr>';
      }).join('');
      return '<details class="sheet"><summary>한눈에 보기 — 내 포지션 표</summary><div class="tscroll">' +
        '<table><thead>' + head + '</thead><tbody>' + body + '</tbody></table></div></details>';
    }

    function roundHTML(R) {
      return '<div class="round-head"><h2>' + R.id + ' 라운드</h2>' +
        '<span class="meta">' + R.time + ' 시작 · ' + R.roster.length + '명 · 3게임</span></div>' +
        R.games.map(gameHTML).join('') + sheetHTML(R.roster, R.games);
    }

    /* ============================================================
       명단 탭
       ============================================================ */
    function rosterHTML() {
      var rows = ALL14.map(function (n) {
        return '<tr data-p="' + n + '"><td class="nm">' + n + '</td><td>' +
          CAP[n].map(function (p) { return '<span class="pos ' + p + '">' + p + '</span>'; }).join(' ') +
          '</td><td class="rest">' + (NOTE[n] || '') + '</td></tr>';
      }).join('');
      var counts = ROUNDS.map(function (R) {
        return '<span class="rule">' + R.id + ' ' + R.roster.length + '명</span>';
      }).join('');
      return '<div class="round-head"><h2>명단</h2><span class="meta">전체 14명</span></div>' +
        '<div class="card"><h3><span class="ic">🏐</span>라운드별 인원</h3>' +
        '<div class="rules" style="margin-top:0">' + counts + '</div></div>' +
        '<div class="card"><h3><span class="ic">📋</span>가능 포지션</h3><div class="tscroll"><table><thead>' +
        '<tr><th>이름</th><th>가능 포지션</th><th>비고</th></tr></thead><tbody>' + rows + '</tbody></table></div>' +
        '<p style="margin-top:10px;color:var(--nurungji-brown);font-size:12.5px">' +
        'S 세터 · OP 라이트 · OH 레프트 · MB 센터 · Li 리베로</p></div>';
    }

    /* ============================================================
       공지 탭
       ============================================================ */
    function noticeHTML() {
      return '<div class="round-head"><h2>공지</h2><span class="meta">시작 전에 한 번만 읽어주세요</span></div>' +

        '<div class="card"><h3><span class="ic">🕐</span>진행 순서</h3><dl class="tl">' +
        '<dt>13:00</dt><dd>개별 몸풀기 + 맨투맨</dd>' +
        '<dt>13:40</dt><dd>공격 연습</dd>' +
        '<dt>13:50</dt><dd>서브 연습</dd>' +
        '<dt>14:00</dt><dd><b>1R</b> · 14명</dd>' +
        '<dt>14:50</dt><dd><b>2R</b> · 14명</dd>' +
        '<dt>15:40</dt><dd><b>3R</b> · 13명</dd>' +
        '<dt>16:30</dt><dd><b>4R</b> · 12명</dd>' +
        '<dt>17:00</dt><dd>정리 · 퇴장</dd>' +
        '</dl></div>' +

        '<div class="card"><h3><span class="ic">📍</span>장소 · 주차</h3>' +
        '<p style="font-weight:800;font-size:14.5px;line-height:1.5">서울 광진구 아차산로70길 35<br>' +
        '<span style="font-weight:700;color:var(--nurungji-brown)">광남초등학교</span></p>' +
        '<p style="margin-top:8px">정문으로 들어와 <b>정면에 보이는 건물 3층</b>입니다.</p>' +
        '<ul style="margin-top:8px"><li>주차 — 학교 옆 도로를 따라 주차하시면 됩니다</li></ul>' +
        '<button type="button" id="copyAddr" class="chip" style="margin-top:10px;padding:7px 14px">📋 주소 복사</button>' +
        '</div>' +

        '<div class="card"><h3><span class="ic">🏐</span>게임 방식</h3><ul>' +
        '<li><b>6:6 정규 게임</b>, 세트당 <b>18점</b> · 한 게임 = 1세트 단판</li>' +
        '<li>세 팀(A · B · C)으로 운영합니다 — <b>A vs B → B vs C → C vs A</b> 세 경기를 모두 치른 뒤 10분 휴식</li>' +
        '<li>휴식 후 팀을 새로 짜서 다음 라운드를 시작합니다</li>' +
        '</ul></div>' +

        '<div class="card warn"><h3><span class="ic">📍</span>내 자리 확인</h3><ul>' +
        '<li><b>팀과 포지션은 경기마다 바뀝니다.</b> 매 경기 전에 해당 라운드 탭에서 본인 이름을 확인해 주세요.</li>' +
        '<li>이름을 누르면 모든 라운드의 내 자리가 노란색으로 표시됩니다. 대기 칸에 있으면 그 경기는 쉽니다.</li>' +
        '<li>대각 배치 — <b>S↔OP</b>(존1·4), <b>OH↔OH</b>(존2·5), <b>MB↔Li</b>(존3·6). ' +
        '세터가 존1(우후위)에서 서브로 시작하고, 센터는 전위(존3) · 리베로는 후위(존6)로 고정 교대합니다.</li>' +
        '</ul></div>' +

        '<div class="card"><h3><span class="ic">🚪</span>인원 변동</h3><ul>' +
        '<li><b>우건세</b> 15:30 이탈 — 2R까지 뜁니다</li>' +
        '<li><b>Kat</b> 16:00 이탈 — 3R 2경기까지 뛰고 3경기는 대기입니다</li>' +
        '<li>그래서 3R은 13명, <b>4R은 12명으로 대기 없이 전원 출전</b>합니다</li>' +
        '<li>이 배치표는 <b>확정 14명 기준</b>입니다. 인원이 바뀌면 새로 짜서 다시 올립니다.</li>' +
        '</ul></div>' +

        '<div class="card"><h3><span class="ic">🎒</span>준비물 · 참가비</h3><ul>' +
        '<li><b>실내화 꼭 챙겨오세요</b> (학교 체육관입니다)</li>' +
        '<li>참가비 <b>5,000원</b> — 대관비 분배</li>' +
        '</ul></div>' +

        '<div class="card"><h3><span class="ic">🍙</span>음식물 · 쓰레기</h3><ul>' +
        '<li>음료와 간식은 준비되어 있습니다</li>' +
        '<li>개인 음식물은 간단한 정도로만, <b>냄새가 강한 음식은 자제</b> 부탁드립니다</li>' +
        '<li>쓰레기는 <b>체육관 한곳에 모아만</b> 주세요. 운영자가 정리합니다</li>' +
        '</ul></div>' +

        '<div class="card warn"><h3><span class="ic">🙏</span>부탁드립니다</h3><ul>' +
        '<li><b>지각 · 불참은 미리 알려주세요.</b> 한 명만 바뀌어도 4개 라운드 배치를 전부 다시 짜야 합니다.</li>' +
        '<li>중간에 먼저 가셔야 하면 시간을 미리 말씀해 주세요. 마지막 게임 대기로 빼드립니다.</li>' +
        '<li>17:00에 정리하고 나가야 하니 마지막 라운드 후 네트 · 공 정리 함께 부탁드려요</li>' +
        '</ul></div>';
    }

    /* ============================================================
       렌더
       ============================================================ */
    var TABS = ROUNDS.map(function (R) {
      return { label: R.id, sub: R.time + ' · ' + R.roster.length + '명', html: roundHTML(R) };
    }).concat([
      { label: '명단', sub: '14명', html: rosterHTML(), alt: true },
      { label: '공지', sub: '필독', html: noticeHTML(), alt: true }
    ]);

    var tabs = document.getElementById('tabs'), panels = document.getElementById('panels');
    TABS.forEach(function (T, i) {
      var b = document.createElement('button');
      b.className = 'tab' + (T.alt ? ' alt' : ''); b.type = 'button'; b.setAttribute('role', 'tab');
      b.setAttribute('aria-selected', i === 0 ? 'true' : 'false');
      b.innerHTML = T.label + '<small>' + T.sub + '</small>';
      b.onclick = function () { select(i); };
      tabs.appendChild(b);

      var p = document.createElement('section');
      p.style.display = i === 0 ? '' : 'none';
      p.innerHTML = T.html;
      panels.appendChild(p);
    });

    function select(i) {
      [].forEach.call(tabs.children, function (b, j) { b.setAttribute('aria-selected', i === j ? 'true' : 'false'); });
      [].forEach.call(panels.children, function (s, j) { s.style.display = i === j ? '' : 'none'; });
      tabs.children[i].scrollIntoView({ block: 'nearest', inline: 'center', behavior: 'smooth' });
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    /* ---------- 이름 강조 ---------- */
    var picked = null;
    function applyHighlight() {
      [].forEach.call(document.querySelectorAll('[data-p]'), function (el) {
        el.classList.toggle('hl', !!picked && el.getAttribute('data-p') === picked);
      });
    }
    var ADDR = '서울 광진구 아차산로70길 35 광남초등학교';
    document.addEventListener('click', function (e) {
      var btn = e.target.closest('#copyAddr');
      if (btn) {
        var done = function () { btn.textContent = '✅ 복사됨'; setTimeout(function () { btn.textContent = '📋 주소 복사'; }, 1500); };
        try {
          if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(ADDR).then(done, function () { btn.textContent = ADDR; });
          else btn.textContent = ADDR;
        } catch (err) { btn.textContent = ADDR; }
        return;
      }
      var el = e.target.closest('[data-p]'); if (!el) return;
      var n = el.getAttribute('data-p');
      picked = (picked === n) ? null : n;
      applyHighlight();
    });
  </script>
</body>

</html>
