<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>안치기 · 누룽지도</title>
  <meta name="description" content="온 사람을 솥에 안치듯 넣으면 라운드별 팀을 즉석에서 뽑아주는 도구">
  <meta name="robots" content="noindex">
  <style>
    :root {
      --white: #fff;
      --nurungji-yellow: #fac710;
      --nurungji-brown: #8d6e63;
      --nurungji-dark: #4e342e;
      --nurungji-bg: #fff8e1;
      --nurungji-light: #fffde7;
      --urgent-color: #ff7043;
      --shadow: 0 8px 32px rgba(93, 64, 55, .15);
      --shadow-sm: 0 4px 12px rgba(93, 64, 55, .12);
      --line: rgba(141, 110, 99, .22);
      --pos-s: #fac710;
      --pos-s-fg: #4e342e;
      --pos-op: #ff7043;
      --pos-oh: #8d6e63;
      --pos-mb: #4e342e;
      --pos-li: #00897b;
    }

    * {
      box-sizing: border-box;
      font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, system-ui, Roboto,
        "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", "Apple Color Emoji", sans-serif;
    }

    body {
      margin: 0;
      background: var(--nurungji-bg);
      color: var(--nurungji-dark);
      -webkit-text-size-adjust: 100%;
    }

    .wrap {
      max-width: 940px;
      margin: 0 auto;
      padding: 18px 14px 70px;
    }

    header.hero {
      background: linear-gradient(135deg, #fffdf3, var(--nurungji-light));
      border: 1px solid var(--line);
      border-radius: 20px;
      box-shadow: var(--shadow);
      padding: 48px 18px 16px;
      position: relative;
    }
    .back-btn {
      position: absolute;
      top: 14px;
      left: 14px;
      appearance: none;
      border: 1.5px solid var(--nurungji-brown);
      background: #fffdf6;
      color: var(--nurungji-brown);
      font-family: inherit;
      font-weight: 800;
      font-size: 13px;
      padding: 6px 12px;
      border-radius: 999px;
      cursor: pointer;
      transition: background .15s, color .15s;
    }

    .back-btn:hover {
      background: var(--nurungji-brown);
      color: #fff;
    }

    .lang-toggle {
      position: absolute;
      top: 14px;
      right: 14px;
      appearance: none;
      border: 1.5px solid var(--nurungji-brown);
      background: #fffdf6;
      color: var(--nurungji-brown);
      font-family: inherit;
      font-weight: 800;
      font-size: 13px;
      padding: 6px 14px;
      border-radius: 999px;
      cursor: pointer;
      transition: background .15s, color .15s;
      line-height: 1;
    }
    .lang-toggle:hover {
      background: var(--nurungji-brown);
      color: #fff;
    }

    .kicker {
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .12em;
      color: var(--nurungji-brown);
    }

    h1 {
      margin: 6px 0 4px;
      font-size: 23px;
      letter-spacing: -.02em;
    }

    .sub {
      font-size: 13.5px;
      color: var(--nurungji-brown);
      font-weight: 600;
      line-height: 1.6;
    }

    /* tabs */
    .tabs {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      gap: 5px;
      margin: 16px 0 14px;
      padding: 7px;
      background: rgba(255, 248, 225, .93);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid var(--line);
      border-radius: 15px;
      box-shadow: var(--shadow-sm);
    }

    .tab {
      flex: 1;
      border: 0;
      cursor: pointer;
      border-radius: 10px;
      padding: 10px 6px;
      background: transparent;
      color: var(--nurungji-brown);
      font-size: 14px;
      font-weight: 800;
    }

    .tab[aria-selected="true"] {
      background: var(--nurungji-yellow);
      color: var(--nurungji-dark);
      box-shadow: var(--shadow-sm);
    }

    .card {
      background: var(--white);
      border: 1px solid var(--line);
      border-radius: 18px;
      box-shadow: var(--shadow-sm);
      padding: 15px 15px 13px;
      margin-bottom: 13px;
    }

    .card h3 {
      margin: 0 0 11px;
      font-size: 14.5px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .card h3 span.n {
      font-size: 12px;
      font-weight: 700;
      color: var(--nurungji-brown);
    }

    button.btn {
      border: 0;
      cursor: pointer;
      border-radius: 12px;
      padding: 12px 16px;
      font-size: 14.5px;
      font-weight: 800;
      background: var(--nurungji-dark);
      color: var(--white);
      box-shadow: var(--shadow-sm);
    }

    button.btn.pri {
      background: var(--nurungji-yellow);
      color: var(--nurungji-dark);
      width: 100%;
      padding: 15px;
      font-size: 16px;
    }

    button.btn.ghost {
      background: var(--white);
      color: var(--nurungji-dark);
      border: 1px solid var(--line);
    }

    button.btn:disabled {
      opacity: .45;
      cursor: not-allowed;
    }

    .row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }

    input[type=text],
    input[type=time],
    select {
      border: 1px solid var(--line);
      border-radius: 11px;
      padding: 11px 12px;
      font-size: 15px;
      background: var(--white);
      color: var(--nurungji-dark);
      outline: none;
      min-width: 0;
    }

    input[type=text]:focus,
    input[type=time]:focus,
    select:focus {
      border-color: var(--nurungji-yellow);
    }

    /* 포지션 토글 */
    .ptoggle {
      display: inline-flex;
      gap: 4px;
      flex-wrap: wrap;
    }

    .ptoggle button {
      border: 1px solid var(--line);
      background: var(--white);
      color: var(--nurungji-brown);
      border-radius: 999px;
      padding: 4px 10px;
      font-size: 11.5px;
      font-weight: 800;
      cursor: pointer;
    }

    .ptoggle button i {
      font-style: normal;
      font-size: 9.5px;
      font-weight: 700;
      margin-left: 4px;
      opacity: .85;
    }

    /* ☆ = 이 자리를 주로 승격 / ★ = 현재 주 표시 */
    .ptoggle .star {
      margin-left: 5px;
      font-size: 12px;
      line-height: 1;
      cursor: pointer;
    }

    .ptoggle .star.ismain {
      color: #ffd54a;
      cursor: default;
    }

    /* 주 = 꽉 찬 색, 가능 = 테두리만, 도전 = 점선 */
    .ptoggle button[aria-pressed="true"] {
      color: #fff;
      border-color: transparent;
    }

    .ptoggle button[data-tier="sub"] {
      background: var(--white) !important;
      border: 1.5px solid currentColor;
    }

    .ptoggle button[data-tier="want"] {
      background: var(--white) !important;
      border: 1.5px dashed currentColor;
      opacity: .8;
    }

    .ptoggle button[data-tier="sub"][data-p="S"],
    .ptoggle button[data-tier="want"][data-p="S"] {
      color: #a67c00;
    }

    .ptoggle button[data-tier="sub"][data-p="OP"],
    .ptoggle button[data-tier="want"][data-p="OP"] {
      color: var(--pos-op);
    }

    .ptoggle button[data-tier="sub"][data-p="OH"],
    .ptoggle button[data-tier="want"][data-p="OH"] {
      color: var(--pos-oh);
    }

    .ptoggle button[data-tier="sub"][data-p="MB"],
    .ptoggle button[data-tier="want"][data-p="MB"] {
      color: var(--pos-mb);
    }

    .ptoggle button[data-tier="sub"][data-p="Li"],
    .ptoggle button[data-tier="want"][data-p="Li"] {
      color: var(--pos-li);
    }

    .ptoggle button[aria-pressed="true"][data-p="S"] {
      background: var(--pos-s);
      color: var(--pos-s-fg);
    }

    .ptoggle button[aria-pressed="true"][data-p="OP"] {
      background: var(--pos-op);
    }

    .ptoggle button[aria-pressed="true"][data-p="OH"] {
      background: var(--pos-oh);
    }

    .ptoggle button[aria-pressed="true"][data-p="MB"] {
      background: var(--pos-mb);
    }

    .ptoggle button[aria-pressed="true"][data-p="Li"] {
      background: var(--pos-li);
    }

    /* 명단 행 */
    .prow {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 0;
      border-top: 1px solid var(--line);
      flex-wrap: wrap;
    }

    .prow:first-of-type {
      border-top: 0;
    }

    .prow .who {
      display: flex;
      align-items: center;
      gap: 9px;
      min-width: 108px;
      flex: 0 0 auto;
    }

    .prow .nm {
      font-weight: 800;
      font-size: 14.5px;
    }

    .prow.off {
      opacity: .42;
    }

    .chk {
      width: 24px;
      height: 24px;
      border-radius: 8px;
      border: 2px solid var(--line);
      background: var(--white);
      display: grid;
      place-items: center;
      cursor: pointer;
      font-size: 13px;
      color: transparent;
      flex: 0 0 24px;
      padding: 0;
    }

    .chk[aria-pressed="true"] {
      background: var(--nurungji-yellow);
      border-color: var(--nurungji-yellow);
      color: var(--nurungji-dark);
    }

    /* 고정(📌) — 켜면 그 사람은 주 자리에만 선다 */
    .pinbtn {
      border: 1px solid var(--line);
      background: var(--white);
      border-radius: 9px;
      padding: 4px 7px;
      font-size: 13px;
      line-height: 1;
      cursor: pointer;
      filter: grayscale(1);
      opacity: .5;
    }

    .pinbtn[aria-pressed="true"] {
      background: var(--nurungji-yellow);
      border-color: var(--nurungji-yellow);
      filter: none;
      opacity: 1;
    }

    .pinteam {
      border: 1px solid var(--line);
      border-radius: 9px;
      padding: 5px 6px;
      font-size: 11.5px;
      font-weight: 700;
      background: var(--white);
      color: var(--nurungji-dark);
    }

    .flexbadge {
      background: var(--nurungji-bg);
      border: 1px dashed var(--line);
      border-radius: 999px;
      padding: 3px 9px;
      font-size: 11px;
      font-weight: 800;
      color: var(--nurungji-brown);
    }

    textarea.bulk {
      width: 100%;
      min-height: 76px;
      border: 1px solid var(--line);
      border-radius: 11px;
      padding: 10px 12px;
      font-size: 14px;
      background: var(--white);
      color: var(--nurungji-dark);
      outline: none;
      resize: vertical;
    }

    textarea.bulk:focus {
      border-color: var(--nurungji-yellow);
    }

    .del {
      margin-left: auto;
      border: 0;
      background: transparent;
      color: var(--nurungji-brown);
      font-size: 16px;
      cursor: pointer;
      opacity: .55;
      padding: 4px 6px;
    }

    /* 코트 */
    .game {
      background: var(--white);
      border: 1px solid var(--line);
      border-radius: 18px;
      box-shadow: var(--shadow-sm);
      padding: 15px 13px 13px;
      margin-bottom: 13px;
    }

    .game-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14.5px;
      font-weight: 800;
      margin-bottom: 11px;
    }

    .badge-no {
      background: var(--nurungji-dark);
      color: var(--nurungji-yellow);
      border-radius: 8px;
      font-size: 12px;
      padding: 3px 8px;
    }

    .court {
      display: grid;
      max-width: 460px;
      margin: 0 auto;
    }

    .side {
      border: 2px solid var(--nurungji-brown);
      background: repeating-linear-gradient(45deg, #fffdf5, #fffdf5 10px, #fffbea 10px, #fffbea 20px);
      padding: 8px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }

    .side.top {
      border-radius: 13px 13px 0 0;
      border-bottom: 0;
    }

    .side.bottom {
      border-radius: 0 0 13px 13px;
      border-top: 0;
    }

    .net {
      height: 15px;
      background: repeating-linear-gradient(90deg, var(--nurungji-dark) 0 2px, transparent 2px 6px);
      border-top: 3px solid var(--nurungji-dark);
      border-bottom: 3px solid var(--nurungji-dark);
    }

    .team-label {
      grid-column: 1/-1;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      font-weight: 800;
      color: var(--nurungji-brown);
      padding: 0 2px;
    }

    .team-label .tname {
      background: var(--nurungji-dark);
      color: var(--white);
      border-radius: 7px;
      padding: 2px 8px;
      font-size: 11.5px;
      letter-spacing: .04em;
    }

    .cell {
      background: var(--white);
      border: 1px solid var(--line);
      border-radius: 11px;
      padding: 7px 4px 6px;
      text-align: center;
      min-height: 62px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 3px;
      cursor: pointer;
    }

    .cell .zone {
      font-size: 10px;
      font-weight: 800;
      color: var(--nurungji-brown);
      opacity: .8;
    }

    .cell .name {
      font-size: 13.5px;
      font-weight: 800;
      word-break: keep-all;
    }

    .pos {
      display: inline-block;
      font-size: 10.5px;
      font-weight: 800;
      border-radius: 999px;
      padding: 1px 7px;
      color: #fff;
    }

    .pos.S {
      background: var(--pos-s);
      color: var(--pos-s-fg);
    }

    .pos.OP {
      background: var(--pos-op);
    }

    .pos.OH {
      background: var(--pos-oh);
    }

    .pos.MB {
      background: var(--pos-mb);
    }

    .pos.Li {
      background: var(--pos-li);
    }

    /* 9인제 자리 — 전위 · 중위 · 후위 세 줄을 색으로 구분한다 */
    .pos.FL,
    .pos.FC,
    .pos.FR {
      background: var(--pos-op);
    }

    .pos.CL,
    .pos.CC,
    .pos.CR {
      background: var(--pos-oh);
    }

    .pos.BL,
    .pos.BC,
    .pos.BR {
      background: var(--pos-li);
    }

    /* 사람이 없어 비워 둔 자리 */
    .cell.need {
      background: repeating-linear-gradient(45deg, #fff, #fff 6px, #fff3e0 6px, #fff3e0 12px);
      border: 1.5px dashed var(--urgent-color);
    }

    .cell.need .name {
      color: var(--urgent-color);
      font-size: 12.5px;
    }

    /* 간단히 보기 — 코트 대신 이름만 줄로 */
    .lineup-list {
      display: grid;
      gap: 7px;
    }

    .lineup-list .tline {
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 8px 10px;
      background: var(--white);
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
    }

    .lineup-list .tname {
      background: var(--nurungji-dark);
      color: var(--white);
      border-radius: 7px;
      padding: 2px 8px;
      font-size: 11.5px;
      font-weight: 800;
    }

    .lineup-list .slot {
      font-size: 12.5px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .lineup-list .slot.need {
      color: var(--urgent-color);
    }

    .cell.hl {
      outline: 3px solid var(--nurungji-yellow);
      outline-offset: 1px;
      background: #fffbe6;
    }

    .bench {
      margin-top: 11px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
      font-size: 12.5px;
      color: var(--nurungji-brown);
      font-weight: 700;
    }

    .chip {
      background: var(--nurungji-bg);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 4px 10px;
      font-size: 12.5px;
      font-weight: 700;
      color: var(--nurungji-dark);
      cursor: pointer;
    }

    .chip.hl {
      background: var(--nurungji-yellow);
    }

    .msg {
      border-radius: 14px;
      padding: 13px 15px;
      font-size: 13.5px;
      line-height: 1.7;
      margin-bottom: 13px;
      border: 1px solid;
    }

    .msg.err {
      background: #ffebee;
      border-color: #ef9a9a;
      color: #8e2020;
    }

    .msg.ok {
      background: #e8f5e9;
      border-color: #a5d6a7;
      color: #1b5e20;
    }

    .msg.info {
      background: var(--nurungji-light);
      border-color: var(--line);
      color: var(--nurungji-dark);
    }

    .msg b {
      font-weight: 800;
    }

    .tscroll {
      overflow-x: auto;
      padding-bottom: 8px;
    }

    table {
      border-collapse: collapse;
      width: 100%;
      min-width: 420px;
      font-size: 12.5px;
    }

    th,
    td {
      border-bottom: 1px solid var(--line);
      padding: 7px 8px;
      text-align: left;
      white-space: nowrap;
    }

    th {
      color: var(--nurungji-brown);
      font-size: 11.5px;
    }

    td.nm {
      font-weight: 800;
    }

    tr.hl td {
      background: #fffbe6;
    }

    .muted {
      color: var(--nurungji-brown);
      font-size: 12.5px;
      line-height: 1.7;
    }


    /* 세그먼트 선택 */
    .seg {
      display: flex;
      gap: 4px;
      background: var(--nurungji-bg);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 4px;
    }

    .seg button {
      flex: 1;
      border: 0;
      background: transparent;
      border-radius: 9px;
      padding: 9px 8px;
      font-size: 13px;
      font-weight: 800;
      color: var(--nurungji-brown);
      cursor: pointer;
      line-height: 1.35;
    }

    .seg button small {
      display: block;
      font-size: 10.5px;
      font-weight: 600;
      opacity: .8;
    }

    /* 4단계는 375px 에서 한 줄에 안 들어가 2×2 로 접는다 */
    .seg.four {
      flex-wrap: wrap;
    }

    .seg.four button {
      flex: 1 1 calc(50% - 4px);
      min-width: calc(50% - 4px);
    }

    .seg button[aria-pressed="true"] {
      background: var(--nurungji-dark);
      color: var(--white);
    }

    .tpl {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .tpl button {
      border: 1px solid var(--line);
      background: var(--white);
      color: var(--nurungji-brown);
      border-radius: 11px;
      padding: 8px 11px;
      font-size: 12.5px;
      font-weight: 800;
      cursor: pointer;
      line-height: 1.4;
      text-align: left;
    }

    .tpl button small {
      display: block;
      font-size: 10.5px;
      font-weight: 600;
      opacity: .75;
    }

    .tpl button[aria-pressed="true"] {
      background: var(--nurungji-yellow);
      border-color: var(--nurungji-yellow);
      color: var(--nurungji-dark);
    }

    /* 7인 팀의 리베로 */
    .libero {
      grid-column: 1/-1;
      display: flex;
      align-items: center;
      gap: 7px;
      background: rgba(0, 137, 123, .09);
      border: 1px dashed rgba(0, 137, 123, .45);
      border-radius: 10px;
      padding: 6px 9px;
      font-size: 12px;
      font-weight: 700;
      color: #00695c;
      cursor: pointer;
    }

    .libero .nm {
      font-size: 13px;
      font-weight: 800;
      color: var(--nurungji-dark);
    }

    .libero.hl {
      background: #fffbe6;
      border-color: var(--nurungji-yellow);
    }

    .core {
      display: inline-block;
      background: var(--nurungji-dark);
      color: var(--nurungji-yellow);
      border-radius: 6px;
      font-size: 9.5px;
      font-weight: 800;
      padding: 0 5px;
      margin-left: 4px;
      vertical-align: middle;
    }

    @media (max-width:420px) {
      .cell {
        min-height: 58px;
      }

      .cell .name {
        font-size: 12.5px;
      }
    }

    .time-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
      gap: 8px;
      margin-bottom: 8px;
    }

    .time-grid label {
      font-size: 11.5px;
      font-weight: 700;
      color: var(--nurungji-brown);
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .tl-preview {
      font-size: 12.5px;
      color: var(--nurungji-brown);
      font-weight: 700;
      line-height: 1.6;
    }

    .timeline {
      display: flex;
      flex-direction: column;
    }

    .tl-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 7px 10px;
      font-size: 13px;
      font-weight: 700;
      border-left: 3px solid var(--nurungji-yellow);
    }

    /* ============================================================

    /* 일찍 가는 사람은 뒤 경기를 어차피 못 뛰므로, 있는 동안은 우선 출전시킨다 */

    var PIN_SLOT_BONUS = 9.0;

    var BENCH_STREAK_PENALTY = 9.0;
    /* 사람이 없어 비워 둔 자리 하나당 비용. 채울 수 있으면 반드시 채우게 한다 */
    var EMPTY_SLOT_COST = 40.0;
    function slotCost(name, pos, sc, nOpt) {

      var f = F();
      var varietyW = f.varietyW, newBonus = f.newBonus, playW = f.playW;
      var c = s.play * playW;
      /* 적합도: 주 자리에 앉히면 0, 가능이면 fitW, 도전이면 2×fitW */
