<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>배치 도구 · 누룽지도</title>
  <meta name="description" content="명단과 포지션만 넣으면 라운드별 6:6 배치를 즉석에서 뽑는 도구">
  <meta name="robots" content="noindex">
  <style>
    :root {
      --white: #fff;
      --nurungji-yellow: #fac710;
      --nurungji-brown: #8d6e63;
      --nurungji-dark: #4e342e;
      --nurungji-bg: #fff8e1;
      --nurungji-light: #fffde7;
      --urgent-color: #ff7043;
      --shadow: 0 8px 32px rgba(93, 64, 55, .15);
      --shadow-sm: 0 4px 12px rgba(93, 64, 55, .12);
      --line: rgba(141, 110, 99, .22);
      --pos-s: #fac710;
      --pos-s-fg: #4e342e;
      --pos-op: #ff7043;
      --pos-oh: #8d6e63;
      --pos-mb: #4e342e;
      --pos-li: #00897b;
    }

    * {
      box-sizing: border-box;
      font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, system-ui, Roboto,
        "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", "Apple Color Emoji", sans-serif;
    }

    body {
      margin: 0;
      background: var(--nurungji-bg);
      color: var(--nurungji-dark);
      -webkit-text-size-adjust: 100%;
    }

    .wrap {
      max-width: 940px;
      margin: 0 auto;
      padding: 18px 14px 70px;
    }

    header.hero {
      background: linear-gradient(135deg, #fffdf3, var(--nurungji-light));
      border: 1px solid var(--line);
      border-radius: 20px;
      box-shadow: var(--shadow);
      padding: 48px 18px 16px;
      position: relative;
    }
    .back-btn {
      position: absolute;
      top: 14px;
      left: 14px;
      appearance: none;
      border: 1.5px solid var(--nurungji-brown);
      background: #fffdf6;
      color: var(--nurungji-brown);
      font-family: inherit;
      font-weight: 800;
      font-size: 13px;
      padding: 6px 12px;
      border-radius: 999px;
      cursor: pointer;
      transition: background .15s, color .15s;
    }

    .back-btn:hover {
      background: var(--nurungji-brown);
      color: #fff;
    }

    .lang-toggle {
      position: absolute;
      top: 14px;
      right: 14px;
      appearance: none;
      border: 1.5px solid var(--nurungji-brown);
      background: #fffdf6;
      color: var(--nurungji-brown);
      font-family: inherit;
      font-weight: 800;
      font-size: 13px;
      padding: 6px 14px;
      border-radius: 999px;
      cursor: pointer;
      transition: background .15s, color .15s;
      line-height: 1;
    }
    .lang-toggle:hover {
      background: var(--nurungji-brown);
      color: #fff;
    }

    .kicker {
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .12em;
      color: var(--nurungji-brown);
    }

    h1 {
      margin: 6px 0 4px;
      font-size: 23px;
      letter-spacing: -.02em;
    }

    .sub {
      font-size: 13.5px;
      color: var(--nurungji-brown);
      font-weight: 600;
      line-height: 1.6;
    }

    /* tabs */
    .tabs {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      gap: 5px;
      margin: 16px 0 14px;
      padding: 7px;
      background: rgba(255, 248, 225, .93);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid var(--line);
      border-radius: 15px;
      box-shadow: var(--shadow-sm);
    }

    .tab {
      flex: 1;
      border: 0;
      cursor: pointer;
      border-radius: 10px;
      padding: 10px 6px;
      background: transparent;
      color: var(--nurungji-brown);
      font-size: 14px;
      font-weight: 800;
    }

    .tab[aria-selected="true"] {
      background: var(--nurungji-yellow);
      color: var(--nurungji-dark);
      box-shadow: var(--shadow-sm);
    }

    .card {
      background: var(--white);
      border: 1px solid var(--line);
      border-radius: 18px;
      box-shadow: var(--shadow-sm);
      padding: 15px 15px 13px;
      margin-bottom: 13px;
    }

    .card h3 {
      margin: 0 0 11px;
      font-size: 14.5px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .card h3 span.n {
      font-size: 12px;
      font-weight: 700;
      color: var(--nurungji-brown);
    }

    button.btn {
      border: 0;
      cursor: pointer;
      border-radius: 12px;
      padding: 12px 16px;
      font-size: 14.5px;
      font-weight: 800;
      background: var(--nurungji-dark);
      color: var(--white);
      box-shadow: var(--shadow-sm);
    }

    button.btn.pri {
      background: var(--nurungji-yellow);
      color: var(--nurungji-dark);
      width: 100%;
      padding: 15px;
      font-size: 16px;
    }

    button.btn.ghost {
      background: var(--white);
      color: var(--nurungji-dark);
      border: 1px solid var(--line);
    }

    button.btn:disabled {
      opacity: .45;
      cursor: not-allowed;
    }

    .row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }

    input[type=text],
    input[type=time],
    select {
      border: 1px solid var(--line);
      border-radius: 11px;
      padding: 11px 12px;
      font-size: 15px;
      background: var(--white);
      color: var(--nurungji-dark);
      outline: none;
      min-width: 0;
    }

    input[type=text]:focus,
    input[type=time]:focus,
    select:focus {
      border-color: var(--nurungji-yellow);
    }

    /* 포지션 토글 */
    .ptoggle {
      display: inline-flex;
      gap: 4px;
      flex-wrap: wrap;
    }

    .ptoggle button {
      border: 1px solid var(--line);
      background: var(--white);
      color: var(--nurungji-brown);
      border-radius: 999px;
      padding: 4px 10px;
      font-size: 11.5px;
      font-weight: 800;
      cursor: pointer;
    }

    .ptoggle button[aria-pressed="true"] {
      color: #fff;
      border-color: transparent;
    }

    .ptoggle button[aria-pressed="true"][data-p="S"] {
      background: var(--pos-s);
      color: var(--pos-s-fg);
    }

    .ptoggle button[aria-pressed="true"][data-p="OP"] {
      background: var(--pos-op);
    }

    .ptoggle button[aria-pressed="true"][data-p="OH"] {
      background: var(--pos-oh);
    }

    .ptoggle button[aria-pressed="true"][data-p="MB"] {
      background: var(--pos-mb);
    }

    .ptoggle button[aria-pressed="true"][data-p="Li"] {
      background: var(--pos-li);
    }

    /* 명단 행 */
    .prow {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 0;
      border-top: 1px solid var(--line);
      flex-wrap: wrap;
    }

    .prow:first-of-type {
      border-top: 0;
    }

    .prow .who {
      display: flex;
      align-items: center;
      gap: 9px;
      min-width: 108px;
      flex: 0 0 auto;
    }

    .prow .nm {
      font-weight: 800;
      font-size: 14.5px;
    }

    .prow.off {
      opacity: .42;
    }

    .chk {
      width: 24px;
      height: 24px;
      border-radius: 8px;
      border: 2px solid var(--line);
      background: var(--white);
      display: grid;
      place-items: center;
      cursor: pointer;
      font-size: 13px;
      color: transparent;
      flex: 0 0 24px;
      padding: 0;
    }

    .chk[aria-pressed="true"] {
      background: var(--nurungji-yellow);
      border-color: var(--nurungji-yellow);
      color: var(--nurungji-dark);
    }

    .del {
      margin-left: auto;
      border: 0;
      background: transparent;
      color: var(--nurungji-brown);
      font-size: 16px;
      cursor: pointer;
      opacity: .55;
      padding: 4px 6px;
    }

    /* 코트 */
    .game {
      background: var(--white);
      border: 1px solid var(--line);
      border-radius: 18px;
      box-shadow: var(--shadow-sm);
      padding: 15px 13px 13px;
      margin-bottom: 13px;
    }

    .game-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14.5px;
      font-weight: 800;
      margin-bottom: 11px;
    }

    .badge-no {
      background: var(--nurungji-dark);
      color: var(--nurungji-yellow);
      border-radius: 8px;
      font-size: 12px;
      padding: 3px 8px;
    }

    .court {
      display: grid;
      max-width: 460px;
      margin: 0 auto;
    }

    .side {
      border: 2px solid var(--nurungji-brown);
      background: repeating-linear-gradient(45deg, #fffdf5, #fffdf5 10px, #fffbea 10px, #fffbea 20px);
      padding: 8px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }

    .side.top {
      border-radius: 13px 13px 0 0;
      border-bottom: 0;
    }

    .side.bottom {
      border-radius: 0 0 13px 13px;
      border-top: 0;
    }

    .net {
      height: 15px;
      background: repeating-linear-gradient(90deg, var(--nurungji-dark) 0 2px, transparent 2px 6px);
      border-top: 3px solid var(--nurungji-dark);
      border-bottom: 3px solid var(--nurungji-dark);
    }

    .team-label {
      grid-column: 1/-1;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      font-weight: 800;
      color: var(--nurungji-brown);
      padding: 0 2px;
    }

    .team-label .tname {
      background: var(--nurungji-dark);
      color: var(--white);
      border-radius: 7px;
      padding: 2px 8px;
      font-size: 11.5px;
      letter-spacing: .04em;
    }

    .cell {
      background: var(--white);
      border: 1px solid var(--line);
      border-radius: 11px;
      padding: 7px 4px 6px;
      text-align: center;
      min-height: 62px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 3px;
      cursor: pointer;
    }

    .cell .zone {
      font-size: 10px;
      font-weight: 800;
      color: var(--nurungji-brown);
      opacity: .8;
    }

    .cell .name {
      font-size: 13.5px;
      font-weight: 800;
      word-break: keep-all;
    }

    .pos {
      display: inline-block;
      font-size: 10.5px;
      font-weight: 800;
      border-radius: 999px;
      padding: 1px 7px;
      color: #fff;
    }

    .pos.S {
      background: var(--pos-s);
      color: var(--pos-s-fg);
    }

    .pos.OP {
      background: var(--pos-op);
    }

    .pos.OH {
      background: var(--pos-oh);
    }

    .pos.MB {
      background: var(--pos-mb);
    }

    .pos.Li {
      background: var(--pos-li);
    }

    .cell.hl {
      outline: 3px solid var(--nurungji-yellow);
      outline-offset: 1px;
      background: #fffbe6;
    }

    .bench {
      margin-top: 11px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
      font-size: 12.5px;
      color: var(--nurungji-brown);
      font-weight: 700;
    }

    .chip {
      background: var(--nurungji-bg);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 4px 10px;
      font-size: 12.5px;
      font-weight: 700;
      color: var(--nurungji-dark);
      cursor: pointer;
    }

    .chip.hl {
      background: var(--nurungji-yellow);
    }

    .msg {
      border-radius: 14px;
      padding: 13px 15px;
      font-size: 13.5px;
      line-height: 1.7;
      margin-bottom: 13px;
      border: 1px solid;
    }

    .msg.err {
      background: #ffebee;
      border-color: #ef9a9a;
      color: #8e2020;
    }

    .msg.ok {
      background: #e8f5e9;
      border-color: #a5d6a7;
      color: #1b5e20;
    }

    .msg.info {
      background: var(--nurungji-light);
      border-color: var(--line);
      color: var(--nurungji-dark);
    }

    .msg b {
      font-weight: 800;
    }

    .tscroll {
      overflow-x: auto;
      padding-bottom: 8px;
    }

    table {
      border-collapse: collapse;
      width: 100%;
      min-width: 420px;
      font-size: 12.5px;
    }

    th,
    td {
      border-bottom: 1px solid var(--line);
      padding: 7px 8px;
      text-align: left;
      white-space: nowrap;
    }

    th {
      color: var(--nurungji-brown);
      font-size: 11.5px;
    }

    td.nm {
      font-weight: 800;
    }

    tr.hl td {
      background: #fffbe6;
    }

    .muted {
      color: var(--nurungji-brown);
      font-size: 12.5px;
      line-height: 1.7;
    }


    /* 세그먼트 선택 */
    .seg {
      display: flex;
      gap: 4px;
      background: var(--nurungji-bg);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 4px;
    }

    .seg button {
      flex: 1;
      border: 0;
      background: transparent;
      border-radius: 9px;
      padding: 9px 8px;
      font-size: 13px;
      font-weight: 800;
      color: var(--nurungji-brown);
      cursor: pointer;
      line-height: 1.35;
    }

    .seg button small {
      display: block;
      font-size: 10.5px;
      font-weight: 600;
      opacity: .8;
    }

    .seg button[aria-pressed="true"] {
      background: var(--nurungji-dark);
      color: var(--white);
    }

    .tpl {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .tpl button {
      border: 1px solid var(--line);
      background: var(--white);
      color: var(--nurungji-brown);
      border-radius: 11px;
      padding: 8px 11px;
      font-size: 12.5px;
      font-weight: 800;
      cursor: pointer;
      line-height: 1.4;
      text-align: left;
    }

    .tpl button small {
      display: block;
      font-size: 10.5px;
      font-weight: 600;
      opacity: .75;
    }

    .tpl button[aria-pressed="true"] {
      background: var(--nurungji-yellow);
      border-color: var(--nurungji-yellow);
      color: var(--nurungji-dark);
    }

    /* 7인 팀의 리베로 */
    .libero {
      grid-column: 1/-1;
      display: flex;
      align-items: center;
      gap: 7px;
      background: rgba(0, 137, 123, .09);
      border: 1px dashed rgba(0, 137, 123, .45);
      border-radius: 10px;
      padding: 6px 9px;
      font-size: 12px;
      font-weight: 700;
      color: #00695c;
      cursor: pointer;
    }

    .libero .nm {
      font-size: 13px;
      font-weight: 800;
      color: var(--nurungji-dark);
    }

    .libero.hl {
      background: #fffbe6;
      border-color: var(--nurungji-yellow);
    }

    .core {
      display: inline-block;
      background: var(--nurungji-dark);
      color: var(--nurungji-yellow);
      border-radius: 6px;
      font-size: 9.5px;
      font-weight: 800;
      padding: 0 5px;
      margin-left: 4px;
      vertical-align: middle;
    }

    @media (max-width:420px) {
      .cell {
        min-height: 58px;
      }

      .cell .name {
        font-size: 12.5px;
      }
    }

    .time-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
      gap: 8px;
      margin-bottom: 8px;
    }

    .time-grid label {
      font-size: 11.5px;
      font-weight: 700;
      color: var(--nurungji-brown);
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .tl-preview {
      font-size: 12.5px;
      color: var(--nurungji-brown);
      font-weight: 700;
      line-height: 1.6;
    }

    .timeline {
      display: flex;
      flex-direction: column;
    }

    .tl-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 7px 10px;
      font-size: 13px;
      font-weight: 700;
      border-left: 3px solid var(--nurungji-yellow);
    }

    .tl-item .tl-time {
      font-size: 12px;
      font-weight: 800;
      color: var(--nurungji-brown);
      min-width: 88px;
      flex: 0 0 auto;
    }

    .tl-item.warmup {
      border-left-color: var(--nurungji-brown);
      opacity: .7;
    }

    .tl-item.rest {
      border-left-color: var(--nurungji-brown);
      opacity: .6;
      font-style: italic;
    }

    .past-round {
      border: 1px solid var(--edge, #ecdfba);
      border-radius: 12px;
      margin-bottom: 10px;
      overflow: hidden;
    }
    .past-round > summary {
      cursor: pointer;
      padding: 11px 14px;
      font-weight: 800;
      font-size: 14px;
      list-style: none;
      background: rgba(0,0,0,.02);
    }
    .past-round > summary::-webkit-details-marker { display: none; }
    .past-round > summary::before {
      content: "▸";
      display: inline-block;
      margin-right: 8px;
      transition: transform .15s;
      color: var(--nurungji-brown);
    }
    .past-round[open] > summary::before { transform: rotate(90deg); }
    .past-round > summary .muted { font-weight: 600; font-size: 12px; }
    .past-round > *:not(summary) { padding: 0 14px; }
    .past-round > *:last-child { padding-bottom: 12px; }

    .tl-item .tl-leave {
      font-size: 11.5px;
      color: var(--urgent-color);
      font-weight: 800;
      margin-left: auto;
    }

    input[type=time].leave-input {
      border: 1px solid var(--line);
      border-radius: 9px;
      padding: 4px 5px;
      font-size: 11.5px;
      background: var(--white);
      color: var(--nurungji-dark);
      outline: none;
      font-weight: 700;
      width: 80px;
      flex: 0 0 80px;
      min-width: 0;
    }

    input[type=time].leave-input:focus {
      border-color: var(--nurungji-yellow);
    }
  </style>
</head>

<body>
  <div class="wrap">
    <header class="hero">
      <button class="back-btn" type="button" id="backBtn" data-i18n="back">← 누룽지도</button>
      <button class="lang-toggle" type="button" id="langBtn">EN</button>
      <h1>배치 도구</h1>
      <div class="sub">명단과 가능 포지션만 넣으면 라운드 배치를 즉석에서 뽑습니다.<br>
        온 사람만 체크하고 <b>뽑기</b>를 누르세요.</div>
    </header>

    <div class="tabs" role="tablist">
      <button class="tab" type="button" aria-selected="true" data-t="0" data-i18n="tab_lineup">배치</button>
      <button class="tab" type="button" aria-selected="false" data-t="1" data-i18n="tab_roster">명단</button>
      <button class="tab" type="button" aria-selected="false" data-t="2" data-i18n="tab_record">기록</button>
      <button class="tab" type="button" aria-selected="false" data-t="3" data-i18n="tab_help">설명</button>
    </div>

    <section id="p0"></section>
    <section id="p1" style="display:none"></section>
    <section id="p2" style="display:none"></section>
    <section id="p3" style="display:none"></section>
  </div>

  <script>
    /* ============================================================
       상수
       ============================================================ */
    var POS = ['S', 'OP', 'OH', 'MB', 'Li'];
    var POS_KO = { S: '세터', OP: '라이트', OH: '레프트', MB: '센터', Li: '리베로' };

    /* ===== i18n ===== */
    /* ?lang= 가 있으면 그걸 우선한다. 누룽지도에서 넘어올 때 호스트 언어를 물려받는 경로. */
    var lang = (function () {
      var q = new URLSearchParams(location.search).get('lang');
      if (q === 'ko' || q === 'en') {
        try { localStorage.setItem('gvt.lang.v1', q); } catch (e) { }
        return q;
      }
      try { return localStorage.getItem('gvt.lang.v1') || 'ko'; } catch (e) { return 'ko'; }
    })();
    var I18N = {
      ko: {
        back: '← 누룽지도',
        roster_empty: '아직 명단이 없습니다. 아래에서 사람을 추가하세요.',
        clear_confirm: '명단을 전부 비웁니다. 계속할까요?',
        hero_title: '배치 도구',
        hero_sub: '명단과 가능 포지션만 넣으면 라운드 배치를 즉석에서 뽑습니다.<br>온 사람만 체크하고 <b>뽑기</b>를 누르세요.',
        tab_lineup: '배치', tab_roster: '명단', tab_record: '기록', tab_help: '설명',

    var players = load(KEY_P, null) || DEFAULT_PLAYERS.map(function (d) {
      return { name: d[0], pos: d[1], here: true, leave: d[2] || null };

    var round = load('gvt.round.v1', null) || 1;
    var pastRounds = load('gvt.past.v1', null) || [];
    var nGames = load('gvt.ngames.v1', null) || 3;
    var mode = load('gvt.mode.v1', null) || 'abc';           /* 'abc' | 'free' */
    var priority = load('gvt.priority.v1', null) || 'balance'; /* 'balance' | 'variety' */
    var allowed = load('gvt.tpl.v1', null) || ['mb2', 'mb1li', 'mb2li'];
    var schedule = load('gvt.schedule.v1', null) || { start: '13:00', warmup: '14:00', end: '17:00', perGame: 15, rest: 10 };
    if (schedule.rest == null) schedule.rest = 10;

      if (!stat[n]) stat[n] = { play: 0, bench: 0, pos: { S: 0, OP: 0, OH: 0, MB: 0, Li: 0 } };

    }
    function persist() {
      save(KEY_P, players); save(KEY_H, stat); save('gvt.round.v1', round);
      save('gvt.ngames.v1', nGames); save('gvt.mode.v1', mode); save('gvt.tpl.v1', allowed);
      save('gvt.priority.v1', priority);

      save('gvt.past.v1', pastRounds);

    function parseTime(s) {

    function gameStartMin(rnd, gi) {

        + ((rnd - 1) * nGames + gi) * schedule.perGame

    }
    function gameEndMin(rnd, gi) {

    }

    /* ============================================================
       공정성 비용
       ------------------------------------------------------------
       포지션 반복 벌점은 '고를 수 있는 사람'에게만 매긴다.
       단일 포지션 인원에게 반복 벌점을 주면 그 사람만 계속 대기로 밀려난다.
       ============================================================ */
    /* 일찍 가는 사람은 뒤 경기를 어차피 못 뛰므로, 있는 동안은 우선 출전시킨다 */
    var EARLY_SLOT_BONUS = 5.0, EARLY_BENCH_PENALTY = 10.0;
    var SETTER_OVERUSE_N = 2;   // 세터가 팀 평균보다 이만큼(게임) 더 뛰면 세터 자리를 Flex에 개방
    function slotCost(name, pos, sc, nOpt) {
      var s = sc[name];
      var varietyW = (priority === 'variety') ? 4.0 : 1.2;  // repeat penalty per prior game in this pos
      var newBonus = (priority === 'variety') ? 6.0 : 1.5;  // reward for a never-played position
      var playW = (priority === 'variety') ? 0.6 : 1.5;     // variety mode cares less about play-count evenness
      var c = s.play * playW;
      c -= (POS.length - nOpt) * 1.0;
      if (s.early) c -= EARLY_SLOT_BONUS;
      if (nOpt > 1) {
        c += (s.pos[pos] || 0) * varietyW;
        if (pos === 'MB') c += (s.pos.MB || 0) * varietyW;
        if (!s.pos[pos]) c -= newBonus;
      }
      /* 과출전 세터 개방: 세터 전용(nOpt===1)이 팀 평균보다 N게임 이상 많이 뛰었으면
         그 세터를 세터 자리에 앉히는 비용을 크게 올려, Flex가 대신 세터로 들어가게 한다.
         (하드 제약이 아니라 비용 편향이라, Flex가 없으면 여전히 이 세터가 들어감) */
      if (pos === 'S') {
        var avg = sc.__avgPlay != null ? sc.__avgPlay : 0;
        if (nOpt === 1 && s.play >= avg + SETTER_OVERUSE_N) {

        }

    }
    function benchCost(name, sc, avgPlay) {
      var s = sc[name];

    function isEarly(p) {

      var avg = 0;

      avg = present.length ? avg / present.length : 0;
      present.forEach(function (p) {
        var s = st(p.name);

    }
    function finish(present, sc, assign, slots, teamNames) {
      var t = [[], []], cost = 0, used = {}, capOf = {};
      present.forEach(function (q) { capOf[q.name] = q.pos.length; });
      assign.forEach(function (a) {
        t[a.team].push({ n: a.n, p: a.p });
        used[a.n] = 1;
        cost += slotCost(a.n, a.p, sc, capOf[a.n]);
      });
      var bench = present.filter(function (q) { return !used[q.name]; }).map(function (q) { return q.name; });
      var avg = 0;
      present.forEach(function (q) { avg += sc[q.name].play; });
      avg /= present.length;
      bench.forEach(function (n) { cost += benchCost(n, sc, avg); });
      return { teams: t, names: teamNames, bench: bench, cost: cost };
    }

    /* ============================================================
       공통 백트래킹 — 남은 후보가 가장 적은 자리부터 채운다(MRV)
         slots[i] = {team, pos, allow}   allow=null 이면 누구나
         must[team] = 반드시 그 팀에 들어가야 하는 이름 집합 (A·B·C 모드)
       ============================================================ */
    function search(present, sc, slots, must, budget) {
      var N = slots.length, used = {}, assign = new Array(N), nodes = 0, cap = budget || 3000;
      var left = [0, 0], need = [0, 0], i;
      for (i = 0; i < N; i++) left[slots[i].team]++;
      if (must) for (i = 0; i < present.length; i++) {
        if (must[0][present[i].name]) need[0]++;
        else if (must[1][present[i].name]) need[1]++;
      }

      function ok(p, sl) {
        if (used[p.name]) return false;
        if (p.pos.indexOf(sl.pos) < 0) return false;
        if (sl.allow && sl.allow.indexOf(p.core) < 0) return false;
        if (must && must[1 - sl.team][p.name]) return false;
        return true;
      }

      function bt(depth) {
        /* 코어 인원을 남은 자리 안에 다 못 넣으면 가지치기.
           depth === N 보다 먼저 봐야 한다. 마지막 자리에 코어가 아닌 사람을
           넣고 끝내버리면 코어 인원이 벤치로 새기 때문. */
        if (must && (need[0] > left[0] || need[1] > left[1])) return false;
        if (depth === N) return true;
        if (++nodes > cap) return false;

        if (bc === null || bc.length === 0) return false;
        bc = bc.slice().sort(function (a, b) {
          return (slotCost(a.name, slots[bi].pos, sc, a.pos.length) + Math.random() * 1.6) -

        });

          left[tm]++; if (must && must[tm][p.name]) need[tm]++;

    function mkSlots(tplA, tplB, allowA, allowB) {

      for (i = 0; i < tplB.slots.length; i++) o.push({ team: 1, pos: tplB.slots[i], allow: allowB || null });

    }

    /* ============================================================
       자유 편성 — 매 경기 참석자 전원 중에서 두 팀을 새로 짠다
       ============================================================ */

      /* 해가 존재하는지 먼저 확인 */
      for (i = 0; i < T.length && !probe; i++) {

          if (T[i].size + T[j].size > present.length) continue;
          as = search(present, sc, mkSlots(T[i], T[j]), null, 20000);
          if (as) probe = finish(present, sc, as, null, ['A', 'B']);

      }
      if (!probe) return null;

        if (a.size + b.size > present.length) continue;
        as = search(present, sc, mkSlots(a, b), null, 3000);

    /* ============================================================
       A · B · C 고정 + 차출
       ------------------------------------------------------------
       세 팀의 코어를 라운드 시작에 정하고, 경기마다 두 팀이 붙는다.
       코어 인원은 자기 팀 경기에 반드시 출전하고,
       모자란 자리는 그 경기에 안 뛰는 팀에서 차출해 채운다.
       ============================================================ */
    var PAIRS = [[0, 1, 2], [1, 2, 0], [2, 0, 1]];   /* A vs B(C 차출), B vs C(A), C vs A(B) */
    var TEAM_NAME = ['A', 'B', 'C'];

    /* A · B를 팀 인원만큼 꽉 채우고, 남는 인원이 C 코어가 된다.

    function coreSizes(n, T) {

    function fitsTemplate(members, tpl) {

      var slots = tpl.slots, used = new Array(slots.length);

        for (var k = 0; k < slots.length; k++) {

    /* 포지션 선택지가 적은 사람부터, 아직 자리가 많이 남은 코어로 보낸다.

    function makeCores(present, szs, T) {
      var avgP = 0;
      present.forEach(function (p) { avgP += st(p.name).play; });
      avgP = present.length ? avgP / present.length : 0;
      /* 과출전 세터 판정: 세터 전용(pos===['S'])이고 평균보다 N게임 이상 많이 뛴 사람.
         이런 사람은 코어 배정에서 뒤로 밀어 이번 라운드 쉬게 하고, 세터 자리를 Flex가 잇게 한다. */

          return ((szs[b] - cores[b].length) - (szs[a] - cores[a].length)) || (Math.random() - .5);
        });
        if (!order.length) return null;
        k = order[0];
        cores[k].push(byFlex[i]);
        byFlex[i].core = k;

    }

    function solveGameABC(present, sc, T, gi, tries) {

        as = search(present, sc, mkSlots(a, b, [X, Z], [Y, Z]), must, 3000);

    function runRoundABC(present, nG, T, quality) {

      var sc = snapshot(present), games = [], i, g;

        g.cores = [0, 1, 2].map(function (c) {

        });
        games.push(g);
        g.teams.forEach(function (t) { t.forEach(function (x) { sc[x.n].play++; sc[x.n].pos[x.p]++; }); });
        g.bench.forEach(function (n) { sc[n].bench++; });

    }

    function solveRoundABC(present, nG) {

      if (!szList.length) return null;

      for (i = 0; i < 80 && !found; i++) {

    function solveRoundFree(present, nG) {

        g = solveGameFree(avail, sc);
        if (!g) return null;
        g.left = present.filter(function (p) { return avail.indexOf(p) < 0; }).map(function (p) { return p.name; });
        games.push(g);
        g.teams.forEach(function (t) { t.forEach(function (x) { sc[x.n].play++; sc[x.n].pos[x.p]++; }); });

    function solveRound(present, nG) {

    }

    /* ============================================================
       안 되는 이유 진단
       ============================================================ */
    function maxSlotFor(P) {

        if (c > m) m = c;

    }
    function minSlotFor(P) {

      tpls().forEach(function (t) {
        var c = t.slots.filter(function (x) { return x === P; }).length;
        if (c < m) m = c;
      });
      return m * 2;
    }
    function minCourt() { return sizes()[0] * 2; }

    function quickInfeasible(present) {
      var n = present.length, mc = minCourt(), i, P, only, able;
      if (n < mc) return true;
      var bench = n - mc;
      for (i = 0; i < POS.length; i++) {
        P = POS[i];
        only = present.filter(function (q) { return q.pos.length === 1 && q.pos[0] === P; }).length;
        if (only > maxSlotFor(P) + bench) return true;
      }
      for (i = 0; i < POS.length; i++) {
        P = POS[i];
        if (minSlotFor(P) === 0) continue;
        able = present.filter(function (q) { return q.pos.indexOf(P) >= 0; }).length;
        if (able < minSlotFor(P)) return true;
      }
      if (mode === 'abc' && !sizes().filter(function (T) { return coreSizes(n, T); }).length) return true;
      return false;
    }

    function diagnose(present) {
      var n = present.length, mc = minCourt(), msgs = [], i, P, only, able;
      if (n < mc) return L('dg_short')(mc, n);
      var bench = n - mc;
      for (i = 0; i < POS.length; i++) {
        P = POS[i];
        only = present.filter(function (q) { return q.pos.length === 1 && q.pos[0] === P; });
        if (only.length > maxSlotFor(P) + bench) {
          msgs.push(L('dg_only')(P, only.length, only.map(function (q) { return q.name; }).join(' · '), maxSlotFor(P), bench));
        }
        if (minSlotFor(P) > 0) {
          able = present.filter(function (q) { return q.pos.indexOf(P) >= 0; }).length;
          if (able < minSlotFor(P)) msgs.push(L('dg_few')(P, able, minSlotFor(P)));
        }
      }
      if (mode === 'abc') {
        var fit = sizes().filter(function (T) { return coreSizes(n, T); });
        if (!fit.length) msgs.push(L('dg_abc')(sizes().map(function (T) { return L('dg_range')(T, 2 * T, 3 * T); }).join(', '), n));
      }
      if (!msgs.length) msgs.push(L('dg_generic'));
      return msgs.join('<br>');
    }

    /* ============================================================
       코트 렌더 — 세터가 존1(우후위)에서 서브 시작
       7인 팀은 리베로를 코트 밖에 따로 표시(후위 센터와 교대)
       ============================================================ */
    function toZones(lineup) {
      var z = {}, ohs = [2, 5], mbs = [3, 6], libero = null, i, p;
      var nMB = lineup.filter(function (x) { return x.p === 'MB'; }).length;
      var nLi = lineup.filter(function (x) { return x.p === 'Li'; }).length;
      var split = (nMB === 2 && nLi === 1);
      for (i = 0; i < lineup.length; i++) {
        p = lineup[i];
        if (p.p === 'S') z[1] = p;
        else if (p.p === 'OP') z[4] = p;
        else if (p.p === 'OH') z[ohs.shift()] = p;
        else if (p.p === 'MB') z[mbs.shift()] = p;
        else if (p.p === 'Li') { if (split) libero = p; else z[6] = p; }
      }
      return { z: z, libero: libero };
    }
    var TOP_ROWS = [[1, 6, 5], [2, 3, 4]], BOT_ROWS = [[4, 3, 2], [5, 6, 1]];

    function sideHTML(team, lineup, isTop, coreNames) {
      var r = toZones(lineup), rows = isTop ? TOP_ROWS : BOT_ROWS, html = '', i, k, zn, pl;
      var label = '<div class="team-label"><span class="tname">' + L('team_word') + ' ' + team + '</span><span>' +
        lineup.length + L('people') + '</span></div>';
      for (i = 0; i < rows.length; i++) for (k = 0; k < rows[i].length; k++) {
        zn = rows[i][k]; pl = r.z[zn];
        html += '<div class="cell" data-p="' + pl.n + '"><span class="zone">' + L('court_zone') + ' ' + zn + '</span>' +
          '<span class="name">' + pl.n + (coreNames && coreNames.indexOf(pl.n) < 0 ? '<span class="core">' + L('borrowed') + '</span>' : '') +
          '</span><span><span class="pos ' + pl.p + '">' + pl.p + '</span></span></div>';
      }
      if (r.libero) {
        html += '<div class="libero" data-p="' + r.libero.n + '"><span class="pos Li">Li</span>' +
          '<span class="nm">' + r.libero.n +
          (coreNames && coreNames.indexOf(r.libero.n) < 0 ? '<span class="core">' + L('borrowed') + '</span>' : '') + '</span>' +
          '<span>' + L('team_swap') + '</span></div>';
      }
      return '<div class="side ' + (isTop ? 'top' : 'bottom') + '">' +
        (isTop ? label + html : html + label) + '</div>';
    }

    function gameHTML(g, idx, rnd) {
      var timeStr = rnd ? '<span style="font-size:12px;font-weight:700;color:var(--nurungji-brown)">' +
        formatTime(gameStartMin(rnd, idx)) + '-' + formatTime(gameEndMin(rnd, idx)) + '</span>' : '';
      var bench = g.bench.length
        ? g.bench.map(function (n) { return '<span class="chip" data-p="' + n + '">' + n + '</span>'; }).join('')
        : '<span class="chip" style="opacity:.6">' + L('bench_none') + '</span>';
      var leftHtml = '';
      if (g.left && g.left.length) {
        leftHtml = '<div class="bench"><span style="color:var(--urgent-color)">' + L('leave_word') + '</span>' +
          g.left.map(function (n) {
            return '<span class="chip" data-p="' + n + '" style="background:rgba(255,112,67,.1);border-color:rgba(255,112,67,.3);color:var(--urgent-color)">' + n + '</span>';
          }).join('') + '</div>';
      }
      var cores = null;
      if (g.cores) cores = [g.cores[TEAM_NAME.indexOf(g.names[0])], g.cores[TEAM_NAME.indexOf(g.names[1])]];
      return '<div class="game"><div class="game-title"><span class="badge-no">' +
        L('game_no') + ' ' + (idx + 1) +
        '</span>' + timeStr + g.names[0] + ' vs ' + g.names[1] + '</div><div class="court">' +
        sideHTML(g.names[0], g.teams[0], true, cores && cores[0]) + '<div class="net"></div>' +
        sideHTML(g.names[1], g.teams[1], false, cores && cores[1]) +
        '</div><div class="bench"><span>' + L('bench_label') + '</span>' + bench + '</div>' + leftHtml + '</div>';
    }

    /* ============================================================
       화면 1 — 배치
       ============================================================ */
    var current = null;
    function here() { return players.filter(function (p) { return p.here; }); }

    function renderPlay() {
      var h = here(), n = h.length, szs = sizes();
      var lo = n - szs[szs.length - 1] * 2, hi = n - szs[0] * 2;
      var benchTxt = (lo === hi) ? Math.max(0, hi) + L('people') :
        Math.max(0, lo) + '~' + Math.max(0, hi) + L('people');

      var mr = maxRounds();
      var lastEnd = mr > 0 && mr < 99 ? formatTime(gameEndMin(mr, nGames - 1)) : '--:--';

      var s = '<div class="card"><h3>' + L('card_time') + '</h3>' +
        '<div class="time-grid">' +
        '<label>' + L('lb_start') + '<input type="time" id="ts" value="' + schedule.start + '"></label>' +
        '<label>' + L('lb_gamestart') + '<input type="time" id="tw" value="' + schedule.warmup + '"></label>' +
        '<label>' + L('lb_end') + '<input type="time" id="te" value="' + schedule.end + '"></label>' +
        '<label>' + L('lb_pergame') + '<select id="tp">' + [10, 12, 15, 20, 25, 30].map(function (m) {
          return '<option value="' + m + '"' + (m === schedule.perGame ? ' selected' : '') + '>' + m + L('min') + '</option>';
        }).join('') + '</select></label>' +
        '<label>' + L('lb_rest') + '<select id="tr">' + [0, 5, 10, 15, 20].map(function (m) {
          return '<option value="' + m + '"' + (m === schedule.rest ? ' selected' : '') + '>' + m + L('min') + '</option>';
        }).join('') + '</select></label>' +
        '</div>' +
        '<div class="tl-preview">' + L('est') + ' <b>' + (mr < 99 ? mr : '?') + L('round_unit') + '</b> · ' + L('round1') + ' ' +
        (nGames * schedule.perGame) + L('min') + ' + ' + L('rest_word') + ' ' + schedule.rest + L('min') + ' · ' + lastEnd + ' ' + L('ends') + '</div>' +
        '</div>';

      s += '<div class="card"><h3>' + L('card_settings') + '</h3>' +
        '<div class="seg" id="mode">' +
        '<button type="button" data-m="abc" aria-pressed="' + (mode === 'abc') + '">' + L('mode_abc') + '<small>' + L('mode_abc_sub') + '</small></button>' +
        '<button type="button" data-m="free" aria-pressed="' + (mode === 'free') + '">' + L('mode_free') + '<small>' + L('mode_free_sub') + '</small></button>' +
        '</div>' +
        '<p class="muted" style="margin:11px 0 7px"><b>' + L('prio_title') + '</b></p>' +
        '<div class="seg" id="prio">' +
        '<button type="button" data-pr="balance" aria-pressed="' + (priority === 'balance') + '">' + L('prio_balance') + '<small>' + L('prio_balance_sub') + '</small></button>' +
        '<button type="button" data-pr="variety" aria-pressed="' + (priority === 'variety') + '">' + L('prio_variety') + '<small>' + L('prio_variety_sub') + '</small></button>' +
        '</div>' +
        '<p class="muted" style="margin:11px 0 7px"><b>' + L('tpl_title') + '</b> ' + L('tpl_hint') + '</p>' +
        '<div class="tpl" id="tpl">' + TEMPLATES.map(function (t) {
          return '<button type="button" data-id="' + t.id + '" aria-pressed="' + (allowed.indexOf(t.id) >= 0) + '">' +
            L(t.labelK) + '<small>' + t.size + L('tpl_person') + ' · ' + L(t.descK) + '</small></button>';
        }).join('') + '</div>' +
        '<div class="row" style="margin-top:11px">' +
        '<label class="chip" style="cursor:default">' + L('games_count') + ' <select id="ng" style="border:0;padding:0 2px;font-size:12.5px;font-weight:700">' +
        [1, 2, 3, 4, 5, 6].map(function (k) {
          return '<option value="' + k + '"' + (k === nGames ? ' selected' : '') + '>' + k + '</option>';
        }).join('') + '</select></label>' +
        '<span class="chip" style="cursor:default">' + L('attend') + ' <b>' + n + L('people') + '</b></span>' +
        '<span class="chip" style="cursor:default">' + L('bench_per') + ' <b>' + benchTxt + '</b></span>' +
        '</div></div>';

      s += '<div class="card"><h3>' + L('this_round') + '<span class="n">' + round + 'R</span></h3>' +
        '<button class="btn pri" id="go">🎲 ' + round + 'R ' + L('draw_btn') + '</button>' +
        '<p class="muted" style="margin:10px 0 0">' + L('draw_hint') + '</p></div>';

      if (quickInfeasible(h)) s += '<div class="msg err">' + diagnose(h) + '</div>';

      if (current) {
        var m = current.mode === 'abc' ? L('ok_abc') : L('ok_free');
        s += '<div class="msg ok">' + L('ok_done_pre') + current.round + L('ok_done_mid') + m +
          L('ok_done_suf') + '</div>';
        if (current.mode === 'abc' && current.games[0].cores) {
          var cc = current.games[0].cores;
          s += '<div class="msg info"><b>' + L('core_title') + '</b><br>' + cc.map(function (c, i) {
            return TEAM_NAME[i] + ' — ' + (c.length ? c.join(' · ') : '<span style="opacity:.6">' + L('core_none') + '</span>');
          }).join('<br>') + '</div>';
          if (!cc[2].length) s += '<div class="msg info" style="border-color:rgba(255,112,67,.4)">' +
            L('no_c_core') + '</div>';
        }
        s += '<div class="card"><h3>' + L('timeline') + '</h3><div class="timeline">' +
          '<div class="tl-item warmup"><span class="tl-time">' + schedule.start + ' - ' + schedule.warmup + '</span>' + L('warmup') + '</div>';
        current.games.forEach(function (cg, gi) {
          var gs = formatTime(gameStartMin(current.round, gi));
          var ge = formatTime(gameEndMin(current.round, gi));
          var ll = (cg.left || []);
          s += '<div class="tl-item"><span class="tl-time">' + gs + ' - ' + ge + '</span>' +
            L('game_word') + ' ' + (gi + 1) + ' ' + cg.names[0] + ' vs ' + cg.names[1] +
            (ll.length ? '<span class="tl-leave"> ⚠ ' + ll.join(' · ') + ' ' + L('leave_word') + '</span>' : '') + '</div>';
        });
        if (schedule.rest > 0 && current.round < maxRounds()) {
          var rs = formatTime(gameEndMin(current.round, nGames - 1));
          var re = formatTime(gameEndMin(current.round, nGames - 1) + schedule.rest);
          s += '<div class="tl-item rest"><span class="tl-time">' + rs + ' - ' + re + '</span>' + L('rest_word') + ' ' + schedule.rest + L('min') + '</div>';
        }
        s += '</div></div>';
        s += current.games.map(function (g, idx) { return gameHTML(g, idx, current.round); }).join('');
        s += '<div class="card"><div class="row">' +
          '<button class="btn ghost" id="again" style="flex:1">🎲 ' + L('again') + '</button>' +
          '<button class="btn" id="fix" style="flex:1">✓ ' + L('confirm_next') + '</button>' +
          '</div><p class="muted" style="margin:10px 0 0">' + L('confirm_hint') + '</p></div>';
      }

      if (pastRounds.length) {
        s += '<div class="card"><h3>' + L('past_title') + '<span class="n">' + pastRounds.length + L('past_unit') + '</span></h3>' +
          '<p class="muted" style="margin:0 0 10px">' + L('past_hint') + '</p>';
        for (var pr = pastRounds.length - 1; pr >= 0; pr--) {
          var R = pastRounds[pr];
          var openAttr = (pr === pastRounds.length - 1) ? ' open' : '';
          s += '<details class="past-round"' + openAttr + '><summary>' + R.round + L('past_round_suf') + ' ' +
            '<span class="muted">(' + formatTime(gameStartMin(R.round, 0)) + '–' +
            formatTime(gameEndMin(R.round, nGames - 1)) + ')</span></summary>';
          s += '<div class="timeline" style="margin:10px 0">';
          R.games.forEach(function (cg, gi) {
            var gs = formatTime(gameStartMin(R.round, gi));
            var ge = formatTime(gameEndMin(R.round, gi));
            var ll = (cg.left || []);
            s += '<div class="tl-item"><span class="tl-time">' + gs + ' - ' + ge + '</span>' +
              L('game_word') + ' ' + (gi + 1) + ' ' + cg.names[0] + ' vs ' + cg.names[1] +
              (ll.length ? '<span class="tl-leave"> ⚠ ' + ll.join(' · ') + ' ' + L('leave_word') + '</span>' : '') + '</div>';
          });
          s += '</div>';
          s += R.games.map(function (g, idx) { return gameHTML(g, idx, R.round); }).join('');
          s += '</details>';
        }
        s += '</div>';
      }

      document.getElementById('p0').innerHTML = s;

      document.getElementById('ng').onchange = function () { nGames = +this.value; persist(); renderPlay(); };
      document.getElementById('mode').onclick = function (e) {
        var b = e.target.closest('button'); if (!b) return;
        mode = b.getAttribute('data-m'); current = null; persist(); renderPlay();
      };
      var prioEl = document.getElementById('prio');
      if (prioEl) prioEl.onclick = function (e) {
        var b = e.target.closest('button'); if (!b) return;
        priority = b.getAttribute('data-pr'); current = null; persist(); renderPlay();
      };
      document.getElementById('tpl').onclick = function (e) {
        var b = e.target.closest('button'); if (!b) return;
        var id = b.getAttribute('data-id'), k = allowed.indexOf(id);
        if (k >= 0) { if (allowed.length === 1) return; allowed.splice(k, 1); }
        else allowed.push(id);
        current = null; persist(); renderPlay();
      };
      document.getElementById('go').onclick = draw;
      if (document.getElementById('again')) document.getElementById('again').onclick = draw;
      if (document.getElementById('fix')) document.getElementById('fix').onclick = commit;
      ['ts', 'tw', 'te'].forEach(function (id, k) {
        var el = document.getElementById(id);
        if (el) el.onchange = function () {
          schedule[['start', 'warmup', 'end'][k]] = this.value;
          current = null; persist(); renderPlay();
        };
      });
      var tpEl = document.getElementById('tp');
      if (tpEl) tpEl.onchange = function () {
        schedule.perGame = +this.value; current = null; persist(); renderPlay();
      };
      var trEl = document.getElementById('tr');
      if (trEl) trEl.onchange = function () {
        schedule.rest = +this.value; current = null; persist(); renderPlay();
      };
      applyHL();
    }

    function draw() {
      var h = here();
      var btn = document.getElementById('go');
      if (btn) { btn.disabled = true; btn.textContent = '뽑는 중…'; }
      setTimeout(function () {
        var games = quickInfeasible(h) ? null : solveRound(h, nGames);
        if (!games) {
          current = null;
          renderPlay();
          document.getElementById('p0').insertAdjacentHTML('beforeend',
            '<div class="msg err"><b>이 인원 · 설정으로는 배치를 만들 수 없습니다.</b><br>' + diagnose(h) + '</div>');
          return;
        }
        current = { round: round, games: games, mode: mode };
        renderPlay();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }, 10);
    }

    function commit() {
      if (!current) return;
      current.games.forEach(function (g) {
        g.teams.forEach(function (t) { t.forEach(function (x) { var s = st(x.n); s.play++; s.pos[x.p]++; }); });
        g.bench.forEach(function (n) { st(n).bench++; });
      });
      pastRounds.push({ round: current.round, games: current.games, mode: current.mode });
      round++; current = null; persist();
      renderPlay(); renderStat();
    }

    /* ============================================================
       화면 2 — 명단
       ============================================================ */
    var newPos = [];
    function renderRoster() {
      var rows = players.length ? players.map(function (p, i) {
        return '<div class="prow' + (p.here ? '' : ' off') + '">' +
          '<div class="who"><button class="chk" type="button" data-i="' + i + '" data-act="here" aria-pressed="' +
          (p.here ? 'true' : 'false') + '">✓</button><span class="nm" data-p="' + p.name + '">' + p.name + '</span></div>' +
          '<div class="ptoggle">' + POS.map(function (P) {
            return '<button type="button" data-i="' + i + '" data-act="pos" data-p="' + P + '" aria-pressed="' +
              (p.pos.indexOf(P) >= 0 ? 'true' : 'false') + '">' + P + '</button>';
          }).join('') + '</div>' +
          '<input type="time" class="leave-input" data-i="' + i + '" value="' + (p.leave || '') + '" title="' + L('leave_title') + '">' +
          '<button class="del" type="button" data-i="' + i + '" data-act="del">✕</button></div>';
      }).join('') : '<p class="muted" style="margin:2px 0 0">' + L('roster_empty') + '</p>';

      document.getElementById('p1').innerHTML =
        '<div class="card"><h3>' + L('roster') + '<span class="n">' + L('roster_attend') + ' ' + here().length + ' / ' + L('roster_total') + ' ' + players.length + L('people') + '</span></h3>' +
        rows + '</div>' +
        '<div class="card"><h3>' + L('add_person') + '</h3><div class="row">' +
        '<input type="text" id="nn" placeholder="' + L('name_ph') + '" style="flex:1;min-width:120px">' +
        '<button class="btn" id="add">' + L('add_btn') + '</button></div>' +
        '<div class="ptoggle" style="margin-top:10px">' + POS.map(function (P) {
          return '<button type="button" data-act="npos" data-p="' + P + '" aria-pressed="' +
            (newPos.indexOf(P) >= 0 ? 'true' : 'false') + '">' + P + (lang === 'en' ? '' : ' ' + POS_KO[P]) + '</button>';
        }).join('') + '</div>' +
        '<p class="muted" style="margin:10px 0 0">' + L('add_hint') + '</p></div>' +
        '<div class="card"><h3>' + L('bulk') + '</h3><div class="row">' +
        '<button class="btn ghost" id="allon">' + L('all_on') + '</button>' +
        '<button class="btn ghost" id="alloff">' + L('all_off') + '</button>' +
        '<button class="btn ghost" id="reset">' + L('to_default') + '</button>' +
        '</div></div>';

      document.getElementById('add').onclick = function () {
        var v = document.getElementById('nn').value.trim();
        if (!v) return;
        if (players.some(function (p) { return p.name === v; })) { alert(L('dup_name')); return; }
        players.push({ name: v, pos: newPos.length ? newPos.slice() : POS.slice(), here: true });
        newPos = []; current = null; persist(); renderRoster(); renderPlay();
      };
      document.getElementById('nn').onkeydown = function (e) {
        if (e.key === 'Enter') document.getElementById('add').click();
      };
      document.getElementById('allon').onclick = function () {
        players.forEach(function (p) { p.here = true; }); current = null; persist(); renderRoster(); renderPlay();
      };
      document.getElementById('alloff').onclick = function () {
        players.forEach(function (p) { p.here = false; }); current = null; persist(); renderRoster(); renderPlay();
      };
      document.getElementById('reset').onclick = function () {
        if (!players.length) return;
        if (!confirm(L('clear_confirm'))) return;
        players = [];
        current = null; persist(); renderRoster(); renderPlay();
      };
      [].forEach.call(document.querySelectorAll('.leave-input'), function (inp) {
        inp.onchange = function () {
          var idx = +this.getAttribute('data-i');
          players[idx].leave = this.value || null;
          current = null; persist(); renderPlay();
        };
      });
      applyHL();
    }

    document.getElementById('p1').addEventListener('click', function (e) {
      var b = e.target.closest('[data-act]'); if (!b) return;
      var act = b.getAttribute('data-act'), i = +b.getAttribute('data-i'), P = b.getAttribute('data-p');
      if (act === 'here') players[i].here = !players[i].here;
      else if (act === 'pos') {
        var k = players[i].pos.indexOf(P);
        if (k >= 0) { if (players[i].pos.length === 1) return; players[i].pos.splice(k, 1); }
        else players[i].pos.push(P);
      }
      else if (act === 'del') {
        if (!confirm(players[i].name + L('del_confirm_suf'))) return;
        players.splice(i, 1);
      }
      else if (act === 'npos') {
        var j = newPos.indexOf(P);
        if (j >= 0) newPos.splice(j, 1); else newPos.push(P);
        b.setAttribute('aria-pressed', j >= 0 ? 'false' : 'true');
        return;
      }
      else return;
      current = null; persist(); renderRoster(); renderPlay();
    });

    /* ============================================================
       화면 3 — 기록
       ============================================================ */
    function renderStat() {
      var names = players.map(function (p) { return p.name; }).filter(function (n) { return stat[n]; });
      var body = names.map(function (n) {
        var s = st(n);
        return '<tr data-p="' + n + '"><td class="nm">' + n + '</td><td>' + s.play + '</td><td>' + s.bench + '</td>' +
          POS.map(function (P) {
            return '<td>' + (s.pos[P] ? '<span class="pos ' + P + '">' + s.pos[P] + '</span>' : '·') + '</td>';
          }).join('') + '</tr>';
      }).join('');

      document.getElementById('p2').innerHTML =
        '<div class="card"><h3>' + L('record_title') + '<span class="n">' + (round - 1) + L('rounds_confirmed_suf') + '</span></h3>' +
        (body ? '<div class="tscroll"><table><thead><tr><th>' + L('th_name') + '</th><th>' + L('th_play') + '</th><th>' + L('th_bench') + '</th>' +
          POS.map(function (P) { return '<th>' + P + '</th>'; }).join('') +
          '</tr></thead><tbody>' + body + '</tbody></table></div>'
          : '<p class="muted">' + L('stat_empty') + '</p>') +
        '<p class="muted" style="margin:10px 0 0">' + L('stat_hint') + '</p></div>' +
        '<div class="card"><h3>' + L('reset_title') + '</h3><div class="row">' +
        '<button class="btn ghost" id="rst">' + L('reset_btn') + '</button></div>' +
        '<p class="muted" style="margin:10px 0 0">' + L('reset_hint') + '</p></div>';

      document.getElementById('rst').onclick = function () {
        if (!confirm(L('reset_confirm'))) return;
        stat = {}; round = 1; current = null; pastRounds = []; persist(); renderStat(); renderPlay();
      };
      applyHL();
    }

    /* ============================================================
       탭 · 이름 강조
       ============================================================ */
    var tabs = document.querySelectorAll('.tab[data-t]');
    [].forEach.call(tabs, function (b) {
      b.onclick = function () {
        var t = +b.getAttribute('data-t');
        [].forEach.call(tabs, function (x, j) { x.setAttribute('aria-selected', j === t ? 'true' : 'false'); });
        [0, 1, 2, 3].forEach(function (j) { document.getElementById('p' + j).style.display = j === t ? '' : 'none'; });
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };
    });

    function applyStaticLang() {
      document.documentElement.setAttribute('lang', lang === 'en' ? 'en' : 'ko');
      [].forEach.call(document.querySelectorAll('[data-i18n]'), function (el) {
        el.textContent = L(el.getAttribute('data-i18n'));
      });
      var hero = document.querySelector('.hero h1'); if (hero) hero.textContent = L('hero_title');
      var sub = document.querySelector('.hero .sub'); if (sub) sub.innerHTML = L('hero_sub');
      var help = document.getElementById('p3'); if (help) help.innerHTML = HELP_HTML();
      var lb = document.getElementById('langBtn'); if (lb) lb.textContent = lang === 'en' ? '한' : 'EN';
    }
    function applyLang() {
      applyStaticLang();
      renderPlay(); renderRoster(); renderStat();
    }
    /* 같은 사이트에서 넘어왔으면 뒤로가기 — 픽업 탭의 지역·레벨 필터가 URL에 실려 있어
       그대로 복원된다(js/pickup-ui.js syncPickupUrl → js/app.js openPickupListLink).
       주소창으로 직접 들어온 경우엔 픽업 탭으로 보낸다. */
    var backBtn = document.getElementById('backBtn');
    if (backBtn) backBtn.onclick = function () {
      var fromSite = document.referrer.indexOf(location.origin + '/') === 0;
      if (fromSite && history.length > 1) history.back();
      else location.href = 'index.html?tab=pickup';
    };

    var langBtn = document.getElementById('langBtn');
    if (langBtn) langBtn.onclick = function () {
      lang = (lang === 'en') ? 'ko' : 'en';
      try { localStorage.setItem('gvt.lang.v1', lang); } catch (e) { }
      applyLang();
    };

    var picked = null;
    function applyHL() {
      [].forEach.call(document.querySelectorAll('[data-p]'), function (el) {
        if (el.hasAttribute('data-act')) return;
        el.classList.toggle('hl', !!picked && el.getAttribute('data-p') === picked);
      });
    }
    document.addEventListener('click', function (e) {
      var el = e.target.closest('[data-p]');
      if (!el || el.hasAttribute('data-act')) return;
      var n = el.getAttribute('data-p');
      picked = (picked === n) ? null : n;
      applyHL();
    });

    applyStaticLang();
    renderPlay(); renderRoster(); renderStat();
  </script>
</body>

</html>
