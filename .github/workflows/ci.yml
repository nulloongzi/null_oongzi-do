name: CI

# Phase 1 테스트 게이팅 CI (웹).
# 순수 티어(lint + node --test)는 매 push/PR 게이팅, 에뮬레이터 룰 티어는 그 뒤에.
# 방법론: docs/testing-methodology.md

on:
  push:
    branches: ["main", "claude/**"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 티어 0+1: 정적 분석 + 순수 유닛 (에뮬레이터 불필요, 초 단위)
  lint-and-unit:
    name: Lint + Unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install deps
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Unit tests (node --test)
        run: npm run test:unit

  # 티어 2: Firestore/Storage 보안 룰 (Firebase 에뮬레이터 + Java)
  rules:
    name: Firebase rules (emulator)
    runs-on: ubuntu-latest
    needs: lint-and-unit
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install deps
        run: npm ci

      - name: Rules tests (emulators:exec)
        run: npm run test:emulator
