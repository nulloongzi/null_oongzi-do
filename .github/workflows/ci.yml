name: CI

# Phase 1 테스트 게이팅 CI (웹).
# 순수 티어(lint + node --test)는 매 push/PR 게이팅, 에뮬레이터 룰 티어는 그 뒤에.
# 방법론: docs/testing-methodology.md

on:
  push:
    branches: ["main", "claude/**"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 티어 0+1: 정적 분석 + 순수 유닛 (에뮬레이터 불필요, 초 단위)
  lint-and-unit:
    name: Lint + Unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install deps
        run: npm ci

      # functions/ 는 별도 패키지. tests/functions-provider-http.test.js 가
      # 실제 핸들러를 로드하므로 여기 의존성이 없으면 테스트가 통째로 취소된다.
      - name: Install functions deps
        run: npm ci --prefix functions

      - name: ESLint
        run: npm run lint

      - name: Unit tests (node --test)
        run: npm run test:unit

  # 티어 2: Firestore/Storage 보안 룰 (Firebase 에뮬레이터 + Java)
  rules:
    name: Firebase rules (emulator)
    runs-on: ubuntu-latest
    needs: lint-and-unit
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install deps
        run: npm ci

      - name: Rules tests (emulators:exec)
        run: npm run test:emulator

  # 티어 3: 헤드리스 스모크 (Playwright) — 로드/패리티 DOM/필터시트/i18n 토글.
  # 외부 SDK(kakao/firebase CDN) 유래 에러는 허용목록, 앱 코드 회귀는 게이팅.
  smoke:
    name: Headless smoke (Playwright)
    runs-on: ubuntu-latest
    needs: lint-and-unit
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install deps
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Smoke tests
        run: npm run test:smoke
